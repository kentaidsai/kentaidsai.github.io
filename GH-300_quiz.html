<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GH-300 練習題庫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Spline+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f4f0e6;--paper-2:#ece6d8;--card:#fbf9f2;--ink:#22201b;--ink-soft:#56524a;
    --line:#d8d1bf;--accent:#1f7a3d;--accent-soft:#e4efe3;--amber:#b5651d;
    --red:#b23b3b;--red-soft:#f6e3e1;--green:#1f7a3d;--green-soft:#e2f0e2;
    --shadow:0 1px 0 rgba(0,0,0,.04),0 8px 24px -12px rgba(40,35,20,.25);--radius:14px;
  }
  html[data-theme="dark"]{
    --paper:#16140f;--paper-2:#1d1a13;--card:#211d16;--ink:#ece7da;--ink-soft:#9c9686;
    --line:#37322a;--accent:#5bbd77;--accent-soft:#1c2c20;--amber:#d99a4e;
    --red:#e07a72;--red-soft:#33201e;--green:#5bbd77;--green-soft:#1c2c20;
    --shadow:0 1px 0 rgba(0,0,0,.2),0 12px 30px -14px rgba(0,0,0,.7);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:"Spline Sans",-apple-system,sans-serif;
    line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;transition:background .3s,color .3s}
  .wrap{max-width:760px;margin:0 auto;padding:28px 20px 80px}
  header.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px;gap:12px;flex-wrap:wrap}
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand .code{font-family:"JetBrains Mono",monospace;font-weight:700;background:var(--ink);color:var(--paper);
    padding:3px 9px;border-radius:7px;font-size:14px;letter-spacing:.5px}
  .brand h1{font-family:"Fraunces",serif;font-weight:600;font-size:26px;letter-spacing:-.5px}
  .theme-btn{border:1px solid var(--line);background:var(--card);color:var(--ink-soft);border-radius:9px;
    padding:8px 12px;cursor:pointer;font-size:13px;font-family:"JetBrains Mono",monospace;transition:.2s}
  .theme-btn:hover{color:var(--ink);border-color:var(--ink-soft)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-bottom:18px}
  .section-label{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-soft);margin-bottom:14px}
  .modes{display:grid;grid-template-columns:1fr;gap:12px}
  @media(min-width:560px){.modes{grid-template-columns:1fr 1fr 1fr}}
  .mode{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px;cursor:pointer;transition:.18s;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;color:var(--ink)}
  .mode:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:var(--shadow)}
  .mode .ico{font-family:"Fraunces",serif;font-size:30px;line-height:1;color:var(--accent)}
  .mode .t{font-weight:600;font-size:16px}
  .mode .d{font-size:13px;color:var(--ink-soft);line-height:1.4}
  .mode .badge{position:absolute;top:12px;right:12px;font-family:"JetBrains Mono",monospace;font-size:11px;
    background:var(--red-soft);color:var(--red);padding:2px 7px;border-radius:20px;font-weight:700}
  .mode:disabled{opacity:.45;cursor:not-allowed;transform:none}
  .setrow{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .divider{height:1px;background:var(--line);margin:16px 0}
  .stepper{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .stepper button{border:0;background:var(--paper-2);color:var(--ink);width:38px;height:38px;font-size:18px;
    cursor:pointer;font-family:"JetBrains Mono",monospace;transition:.15s}
  .stepper button:hover{background:var(--accent);color:#fff}
  .stepper .val{width:54px;text-align:center;font-family:"JetBrains Mono",monospace;font-weight:700;font-size:16px}
  .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .stat{text-align:center;padding:6px 4px}
  .stat .n{font-family:"Fraunces",serif;font-size:30px;font-weight:600;line-height:1}
  .stat .l{font-size:12px;color:var(--ink-soft);margin-top:5px}
  .btn{border:0;border-radius:10px;padding:13px 20px;font-size:15px;font-weight:600;font-family:"Spline Sans",sans-serif;cursor:pointer;transition:.18s}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{filter:brightness(1.06)}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
  .btn-ghost:hover{border-color:var(--ink-soft)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn-block{width:100%}
  .btn-sm{padding:8px 14px;font-size:13px}
  .qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:8px;flex-wrap:wrap}
  .progress-wrap{margin-bottom:18px}
  .pbar{height:6px;background:var(--paper-2);border-radius:6px;overflow:hidden}
  .pbar i{display:block;height:100%;background:var(--accent);transition:width .35s ease}
  .meta{display:flex;align-items:center;gap:8px;font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--ink-soft)}
  .tag{background:var(--paper-2);padding:3px 9px;border-radius:20px;color:var(--ink-soft);font-size:11px}
  .tag.warn{background:var(--red-soft);color:var(--red)}
  .qtext{font-size:18px;line-height:1.5;margin:8px 0 6px;font-weight:500}
  .multi-hint{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--amber);margin-bottom:14px}
  .opts{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
  .opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);
    background:var(--card);border-radius:11px;padding:13px 15px;cursor:pointer;transition:.14s;font-size:15px;color:var(--ink)}
  .opt:hover{border-color:var(--accent)}
  .opt .k{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:13px;background:var(--paper-2);
    width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--ink-soft)}
  .opt.sel{border-color:var(--accent);background:var(--accent-soft)}
  .opt.sel .k{background:var(--accent);color:#fff}
  .opt.correct{border-color:var(--green);background:var(--green-soft)}
  .opt.correct .k{background:var(--green);color:#fff}
  .opt.wrong{border-color:var(--red);background:var(--red-soft)}
  .opt.wrong .k{background:var(--red);color:#fff}
  .opt.locked{cursor:default}
  .opt.locked:hover{border-color:var(--line)}
  .opt.locked.correct:hover{border-color:var(--green)}
  .opt.locked.wrong:hover{border-color:var(--red)}
  .feedback{border-radius:11px;padding:13px 15px;margin-bottom:14px;font-size:14px;display:none;align-items:center;gap:10px}
  .feedback.show{display:flex}
  .feedback.ok{background:var(--green-soft);color:var(--green)}
  .feedback.no{background:var(--red-soft);color:var(--red)}
  .feedback .fi{font-family:"Fraunces",serif;font-size:22px;line-height:1}
  .nav{display:flex;gap:10px}
  .navbar{display:flex;gap:10px;justify-content:space-between;margin-top:4px}
  .finish-link{display:block;margin:14px auto 0;background:transparent;border:0;color:var(--ink-soft);
    cursor:pointer;font-size:13px;text-decoration:underline;font-family:"Spline Sans"}
  .finish-link:hover{color:var(--ink)}
  .result-score{text-align:center;padding:14px 0 4px}
  .result-score .big{font-family:"Fraunces",serif;font-size:60px;font-weight:600;line-height:1}
  .result-score .sub{color:var(--ink-soft);margin-top:6px}
  .skip-note{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--amber);margin-top:6px}
  .ring{--p:0;width:120px;height:120px;border-radius:50%;margin:0 auto 10px;
    background:conic-gradient(var(--accent) calc(var(--p)*1%), var(--paper-2) 0);display:flex;align-items:center;justify-content:center}
  .ring .inner{width:96px;height:96px;border-radius:50%;background:var(--card);display:flex;align-items:center;
    justify-content:center;font-family:"Fraunces",serif;font-size:30px;font-weight:600}
  .review-item{border-top:1px solid var(--line);padding:14px 0}
  .review-item:first-child{border-top:0}
  .review-q{font-weight:500;margin-bottom:8px;font-size:15px}
  .review-line{font-size:13px;display:flex;gap:8px;margin-top:3px}
  .review-line .lab{font-family:"JetBrains Mono",monospace;color:var(--ink-soft);flex-shrink:0;width:64px}
  .review-line.you .val{color:var(--red)}
  .review-line.ans .val{color:var(--green);font-weight:600}
  .topicbar{margin-bottom:14px}
  .topicbar .tb-head{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;gap:8px}
  .topicbar .tb-head .pct{font-family:"JetBrains Mono",monospace;font-weight:700;flex-shrink:0}
  .tb-track{height:9px;background:var(--paper-2);border-radius:6px;overflow:hidden}
  .tb-track i{display:block;height:100%;border-radius:6px;transition:width .5s}
  .missed-item{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
  .missed-item:first-child{border-top:0}
  .missed-cnt{font-family:"JetBrains Mono",monospace;font-weight:700;color:var(--red);background:var(--red-soft);
    padding:3px 9px;border-radius:20px;font-size:12px;flex-shrink:0}
  .missed-q{font-size:14px}
  .empty{text-align:center;color:var(--ink-soft);padding:24px 0;font-size:14px}
  .danger-link{background:transparent;border:0;color:var(--red);cursor:pointer;font-size:13px;text-decoration:underline;font-family:"Spline Sans"}
  .modal-overlay{position:fixed;inset:0;background:rgba(20,16,10,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
  .modal-overlay.open{display:flex}
  .modal-box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;max-width:380px;width:100%}
  .modal-msg{font-size:15px;margin-bottom:18px;line-height:1.5}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end}
  .search-input{width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:11px 14px;font-size:15px;font-family:"Spline Sans",sans-serif;margin-bottom:12px}
  .search-input:focus{outline:none;border-color:var(--accent)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--ink-soft);border-radius:20px;padding:6px 13px;font-size:13px;cursor:pointer;transition:.15s;font-family:"Spline Sans"}
  .chip:hover{border-color:var(--accent);color:var(--ink)}
  .chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .browse-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:14px}
  .b-meta{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
  .b-q-en{font-size:16px;font-weight:600;line-height:1.5}
  .b-q-zh{font-size:14px;color:var(--ink-soft);line-height:1.5;margin-top:4px;margin-bottom:12px}
  .b-opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin-top:7px;font-size:14px}
  .b-opt.correct{border-color:var(--green);background:var(--green-soft)}
  .b-key{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:12px;background:var(--paper-2);width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--ink-soft)}
  .b-opt.correct .b-key{background:var(--green);color:#fff}
  .b-otext .en{display:block}
  .b-otext .zh{display:block;color:var(--ink-soft);font-size:13px;margin-top:2px}
  .b-ans{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--green);margin-top:10px;font-weight:700}
  .hidden{display:none!important}
  footer{text-align:center;color:var(--ink-soft);font-size:12px;margin-top:30px;font-family:"JetBrains Mono",monospace}
  .fade{animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="code">GH-300</span><h1>練習題庫</h1></div>
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">◐ 深色</button>
  </header>

  <!-- HOME -->
  <main id="home">
    <div class="card">
      <div class="section-label">// 選擇練習模式</div>
      <div class="modes">
        <button class="mode" onclick="start('random')">
          <span class="ico">⤭</span><span class="t">隨機練習</span>
          <span class="d">智慧出題：40% 錯題、40% 練過、20% 新題</span>
        </button>
        <button class="mode" id="modeWrong" onclick="start('wrong')">
          <span class="ico">↻</span><span class="t">錯題複習</span>
          <span class="d">只練你答錯過的題，越常錯越優先</span>
          <span class="badge" id="wrongBadge"></span>
        </button>
        <button class="mode" onclick="openTopicPick()">
          <span class="ico">⧉</span><span class="t">主題練習</span>
          <span class="d">挑選一個主題集中練習</span>
        </button>
      </div>
    </div>

    <div class="card">
      <div class="section-label">// 題庫瀏覽</div>
      <button class="btn btn-ghost btn-block" onclick="showBrowse()">中英對照題庫 — 瀏覽全部 116 題 →</button>
    </div>
    <div class="card">
      <div class="setrow">
        <div>
          <div style="font-weight:600">每次題數</div>
          <div style="font-size:13px;color:var(--ink-soft)">隨機 / 主題模式適用</div>
        </div>
        <div class="stepper">
          <button onclick="changeCount(-5)">–</button>
          <span class="val" id="countVal">15</span>
          <button onclick="changeCount(5)">+</button>
        </div>
      </div>
      <div class="divider"></div>
      <div class="setrow">
        <div>
          <div style="font-weight:600">作答紀錄</div>
          <div style="font-size:13px;color:var(--ink-soft)">存於本機，不會上傳；可隨時清除釋放空間</div>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="resetStats()">清除紀錄</button>
      </div>
    </div>

    <div class="card">
      <div class="section-label">// 累計統計</div>
      <div class="summary">
        <div class="stat"><div class="n" id="sumSeen">0</div><div class="l">練過題數</div></div>
        <div class="stat"><div class="n" id="sumAcc">–</div><div class="l">整體正確率</div></div>
        <div class="stat"><div class="n" id="sumSessions">0</div><div class="l">練習次數</div></div>
      </div>
      <div style="margin-top:16px">
        <button class="btn btn-ghost btn-block" onclick="showStats()">查看詳細統計表 →</button>
      </div>
    </div>
  </main>

  <!-- TOPIC PICKER -->
  <div id="topicPick" class="hidden">
    <div class="card">
      <div class="section-label">// 選擇主題</div>
      <div id="topicList" class="modes" style="grid-template-columns:1fr"></div>
      <div style="margin-top:16px"><button class="btn btn-ghost" onclick="backHome()">← 返回</button></div>
    </div>
  </div>

  <!-- QUIZ -->
  <div id="quiz" class="hidden">
    <div class="progress-wrap">
      <div class="qhead">
        <div class="meta"><span id="qIdx">1 / 15</span></div>
        <div class="meta"><span class="tag" id="qTopic">Topic</span><span class="tag warn hidden" id="qWarn" title="此題標示答案與社群投票不一致">⚠ 答案有爭議</span></div>
      </div>
      <div class="pbar"><i id="pbarFill" style="width:0%"></i></div>
    </div>
    <div class="card">
      <div class="qtext" id="qText"></div>
      <div class="multi-hint hidden" id="qMulti"></div>
      <div class="opts" id="qOpts"></div>
      <div class="feedback" id="qFeedback"><span class="fi" id="fbIcon"></span><span id="fbText"></span></div>
      <button class="btn btn-primary btn-block" id="submitBtn" onclick="submitAnswer()">送出答案</button>
      <div class="navbar">
        <button class="btn btn-ghost" id="prevBtn" onclick="prevQuestion()">← 上一題</button>
        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()">下一題 →</button>
      </div>
      <button class="finish-link" onclick="finishWithCheck()">結束並看成績</button>
    </div>
  </div>

  <!-- RESULT -->
  <div id="result" class="hidden">
    <div class="card">
      <div class="result-score">
        <div class="ring" id="ring"><div class="inner" id="ringPct">0%</div></div>
        <div class="big" id="resScore">0 / 0</div>
        <div class="sub" id="resSub"></div>
        <div class="skip-note hidden" id="resSkip"></div>
      </div>
      <div class="nav" style="margin-top:16px">
        <button class="btn btn-primary" onclick="backHome()">回首頁</button>
        <button class="btn btn-ghost hidden" id="retryWrongBtn" onclick="start('wrong')">複習這次的錯題</button>
      </div>
    </div>
    <div class="card" id="reviewCard">
      <div class="section-label">// 本次錯題回顧</div>
      <div id="reviewList"></div>
    </div>
  </div>

  <!-- STATS -->
  <div id="stats" class="hidden">
    <div class="card">
      <div class="section-label">// 整體表現</div>
      <div class="summary">
        <div class="stat"><div class="n" id="stSeen">0</div><div class="l">練過題數 / 116</div></div>
        <div class="stat"><div class="n" id="stAcc">–</div><div class="l">整體正確率</div></div>
        <div class="stat"><div class="n" id="stAttempts">0</div><div class="l">總作答次數</div></div>
      </div>
    </div>
    <div class="card">
      <div class="section-label">// 各主題正確率</div>
      <div id="topicStats"></div>
    </div>
    <div class="card">
      <div class="section-label">// 最常錯的題目</div>
      <div id="missedList"></div>
    </div>
    <div class="card">
      <div class="nav">
        <button class="btn btn-primary" onclick="backHome()">← 回首頁</button>
        <button class="danger-link" onclick="resetStats()" style="margin-left:auto">清除所有紀錄</button>
      </div>
    </div>
  </div>

  <!-- BROWSE 中英對照 -->
  <div id="browse" class="hidden">
    <div class="card">
      <div class="setrow" style="margin-bottom:12px">
        <button class="btn btn-ghost btn-sm" onclick="backHome()">← 回首頁</button>
        <span class="meta" id="browseCount"></span>
      </div>
      <input class="search-input" id="browseSearch" placeholder="搜尋題目（中英關鍵字皆可）…" oninput="renderBrowse()">
      <div class="chips" id="browseChips"></div>
    </div>
    <div id="browseList"></div>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <div class="modal-msg" id="modalMsg"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="modalNo()">取消</button>
        <button class="btn btn-primary" onclick="modalYes()">確定</button>
      </div>
    </div>
  </div>

  <footer>單機離線 · 紀錄存於本機瀏覽器 · 共 116 題</footer>
</div>

<script>
/* ============ 題庫資料（題目與選項維持英文原文）============ */
const TOPICS = {
  1:"Responsible AI",
  2:"GitHub Copilot plans and features",
  3:"How GitHub Copilot works and handles data",
  4:"Prompt Crafting and Prompt Engineering",
  5:"Developer use cases for AI",
  6:"Testing with GitHub Copilot",
  7:"Privacy fundamentals and context exclusions"
};
// t:主題 q:題目 o:選項(依序A,B,C..) a:答案key陣列 w:標示答案與社群投票不一致
const QUESTIONS = [
/* Topic 1 */
{t:1,q:"Which Microsoft ethical AI principle is aimed at ensuring AI systems treat all people equally?",o:["Privacy and Security","Fairness","Reliability and Safety","Inclusiveness"],a:["B"]},
{t:1,q:"What can be done during AI development to minimize bias?",o:["Collect massive amounts of data for training.","Focus on accuracy of the data.","Use diverse data, fairness metrics, and human oversight.","Improve on the computational efficiency and speed."],a:["C"]},
{t:1,q:"Why is it important to ensure the security of the code used in Generative AI (Gen AI) tools?",o:["Ensuring code security prevents unauthorized access and potential data breaches.","Ensuring code security enables the AI system to handle larger datasets effectively.","Ensuring code security maintains the integrity of the AI system.","Ensuring code security supports the development of more advanced AI features."],a:["A"]},
{t:1,q:"A social media manager wants to use AI to filter content. How can they promote transparency in the platform's AI operations?",o:["By providing clear explanations about the types of content the AI is designed to filter and how it arrives at its conclusion.","By relying on a well-regarded AI development company.","By regularly updating the AI filtering algorithm.","By focusing on user satisfaction with the content filtering"],a:["A"]},
{t:1,q:"How does GitHub Copilot Chat utilize its training data and external sources to generate responses when answering coding questions?",o:["It primarily relies on the model's training data to generate responses.","It combines its training data set, code in user repositories, and external sources like Bing to generate responses.","It uses user-provided documentation and exclusively to generate responses.","It primarily uses search results from Bing to generate responses."],a:["B"]},
{t:1,q:"Which principle emphasizes that AI systems should be understandable and provide clear information on how they work?",o:["Fairness","Accountability","Transparency","Inclusiveness"],a:["C"]},
{t:1,q:"Which of the following is a risk associated with using AI?",o:["AI replaces the need for developer opportunities in most fields.","AI eliminated the need for data privacy regulations.","AI algorithms are incapable of perpetuating existing biases.","AI systems can sometimes make decisions that are difficult to interpret."],a:["D"]},
{t:1,q:"What types of prompts or code snippets might be flagged by the GitHub Copilot toxicity filter? (Choose two.)",o:["Hate speech or discriminatory language (e.g., racial slurs, offensive stereotypes)","Sexually suggestive or explicit content","Code that contains logical errors or produces unexpected results","Code comments containing strong opinions or criticisms"],a:["A","B"]},
{t:1,q:"How can the concept of fairness be integrated into the process of operating an AI tool?",o:["Focusing on accessibility will ensure fairness.","Training AI data and algorithms to be free from biases will ensure fairness.","Regularly monitoring the AI tool's performance will ensure fairness in its outputs.","Focusing on collecting large datasets for training will ensure fairness."],a:["B"]},
{t:1,q:"What are the potential risks associated with relying heavily on code generated from GitHub Copilot? (Choose two.)",o:["GitHub Copilot may introduce security vulnerabilities by suggesting code with known exploits.","GitHub Copilot's suggestions may not always reflect best practices or the latest coding standards.","GitHub Copilot may increase development lead time by providing irrelevant suggestions.","GitHub Copilot may decrease developer velocity by requiring too much time in prompt engineering."],a:["A","B"]},
{t:1,q:"Why might a Generative AI (Gen AI) tool create inaccurate outputs?",o:["The Gen AI tool is programmed with a focus on creativity over factual accuracy.","The Gen AI tool is experiencing downtime and is not fully recovered.","The training data might contain biases or inconsistencies.","The Gen AI tool is being overloaded with too many requests at once."],a:["C"]},
{t:1,q:"What should developers consider when relying on GitHub Copilot for generating code that involves statistical analysis?",o:["GitHub Copilot will automatically correct any statistical errors found in the user's initial code.","GitHub Copilot can independently verify the statistical significance of results.","GitHub Copilot can design new statistical methods that have not been previously documented.","GitHub Copilot's suggestions are based on statistical trends and may not always apply accurately to specific datasets."],a:["D"]},

{t:2,q:"What kind of insights can the GitHub Copilot usage metrics API provide to help evaluate the effectiveness of GitHub Copilot? (Choose two.)",o:["The API can generate detailed reports on code quality improvements made by GitHub Copilot.","The API can track the number of code suggestions accepted and used in the organization.","The API can provide feedback on coding style and standards compliance.","The API can provide Copilot Chat specific suggestions acceptance metrics.","The API can refactor your code to improve productivity."],a:["B","D"]},
{t:2,q:"How do you generate code suggestions with GitHub Copilot in the CLI?",o:["Describe the project's architecture → Use the copilot generate command → Accept the generated suggestion.","Type out the code snippet → Use the copilot refine command to enhance it → Review the suggested command.","Write code comments → Press the suggestion shortcut → Select the best suggestion from the list.","Use 'gh copilot suggest' → Write the command you want → Select the best suggestion from the list."],a:["D"]},

{t:2,q:"How does GitHub Copilot Enterprise assist in code reviews during the pull request process? (Choose two.)",o:["It generates a prose summary and bulleted list of key changes for pull requests.","It can answer questions about the changeset of the pull request.","It automatically merges pull requests after an automated review.","It can validate the accuracy of the changes in the pull request."],a:["A","B"]},

{t:3,q:"What is a likely effect of GitHub Copilot being trained on commonly used code patterns?",o:["Suggest completely novel projects, while reducing time on a project.","Suggest innovative coding solutions that are not yet popular.","Suggest homogeneous solutions if provided a diverse data set.","Suggest code snippets that reflect the most common practices in the training data."],a:["D"]},
{t:3,q:"How does GitHub Copilot typically handle code suggestions that involve deprecated features or syntax of programming languages?",o:["GitHub Copilot always filters out deprecated elements to promote the use of current standards.","GitHub Copilot may suggest deprecated syntax or features if they are present in its training data.","GitHub Copilot rejects all prompts involving deprecated features to avoid compilation errors.","GitHub Copilot automatically updates deprecated features in its suggestions to the latest version."],a:["B"]},
{t:3,q:"Identify the steps involved in the life cycle of a GitHub Copilot code suggestion? (Choose two.)",o:["Processing telemetry data","Generate suggestions","Retraining the model","Storing user data","Capturing the user's context"],a:["B","E"]},
{t:3,q:"What role does the pre-processing of user input play in the data flow of GitHub Copilot Chat?",o:["It formats the output response before presenting it to the user.","It filters out irrelevant information from the user's input prompt.","It enriches the input prompt with additional context before passing it to the language model.","It directly generates a response based on the user's input prompt."],a:["C"]},
{t:3,q:"What are the additional checks that need to pass before the GitHub Copilot responses are submitted to the user? (Choose two.)",o:["Code quality","Compatibility with user-specific settings","Performance benchmarking","Suggestions matching public code (optional based on settings)"],a:["B","D"]},
{t:3,q:"What are the potential limitations of GitHub Copilot Chat? (Choose two.)",o:["Ability to handle complex code structures","Limited training data","Extensive support for all programming languages","No biases in code suggestions"],a:["A","B"]},
{t:3,q:"What is the impact of the \"Fill-In-the-Middle\" (FIM) technique on GitHub Copilot's code suggestions?",o:["Improves suggestions by considering both the prefix and suffix of the code, filling in the middle part more accurately.","Restricts Copilot to use only external databases for generating code suggestions.","Allows Copilot to generate suggestions based only on the prefix of the code.","Ignores both the prefix and suffix of the code, focusing only on user comments for context."],a:["A"]},
{t:3,q:"Which of the following statements correctly describes how GitHub Copilot Individual uses prompt data? (Choose two.)",o:["Real-time user input helps generate context-aware code suggestions.","Prompt data is used internally by GitHub for improving the search engine.","Prompt data is used to train machine learning models for better code suggestions.","Prompt data is stored unencrypted for faster processing."],a:["A","C"]},
{t:3,q:"What is used by GitHub Copilot in the IDE to determine the prompt context?",o:["Information from the IDE like open tabs, cursor location, selected code.","All the code visible in the current IDE.","All the code in the current repository and any git submodules.","The open tabs in the IDE and the current folder of the terminal."],a:["A"]},
{t:3,q:"Which of the following does GitHub Copilot's LLM derive context from when producing a response?",o:["Version control system integrated with the IDE","Syntax highlighting scheme of the code in the IDE","Frequency of commits to the repository","Neighboring or related files within a project"],a:["D"]},
{t:3,q:"What is a benefit of using custom models in GitHub Copilot?",o:["Responses use the organization's LLM engine","Responses are faster to produce and appear sooner","Responses are guaranteed to be correct","Responses use practices and patterns in your repositories"],a:["D"]},
{t:3,q:"How does GitHub Copilot identify matching code and ensure that public code is appropriately handled or blocked? (Choose two.)",o:["Implementing safeguards to detect and avoid suggesting verbatim snippets from public code","Filtering out suggestions that match code from public repositories","Using machine learning models trained only on private repositories","Reviewing and storing user-specific private repository data for future suggestions"],a:["A","B"]},
{t:3,q:"How does GitHub Copilot utilize chat history to enhance its code completion capabilities?",o:["By sharing chat history with third-party services to improve integration and functionality.","By analyzing past chat interactions to identify common programming patterns and errors.","By logging chat history to monitor user activity and ensure compliance with coding standards.","By using chat history to offer personalized code snippets based on previous prompts."],a:["D"]},
{t:3,q:"What is the main purpose of the duplication detection filter in GitHub Copilot?",o:["To compare user-generated code against a private repository for potential matches.","To encourage the user to follow coding best practices preventing code duplication.","To allow administrators to control which suggestions are visible to developers based on custom criteria.","To detect and block suggestions that match public code snippets on GitHub if they contain about 150 characters."],a:["D"]},
{t:3,q:"Where is the proxy service hosted?",o:["Amazon Web Service","Self hosted","Microsoft Azure","Google Cloud Platform"],a:["C"]},
{t:3,q:"How can GitHub Copilot assist developers during the requirements analysis phase of the Software Development Life Cycle (SDLC)?",o:["By managing stakeholder communication and meetings.","By automatically generating detailed requirements documents.","By providing templates and code snippets that help in documenting requirements.","By identifying and fixing potential requirement conflicts when using /help."],a:["C"]},
{t:3,q:"How can you improve the context used by GitHub Copilot? (Choose two.)",o:["By adding variables (#selection) to your prompt","By adding the full file paths to your prompt of important files","By adding the important files to your .gitconfig","By opening the relevant tabs in your IDE"],a:["A","B"],w:true},

{t:4,q:"When crafting prompts for GitHub Copilot, what is a recommended strategy to enhance the relevance of the generated code?",o:["Keep the prompt as short as possible, using single words or brief phrases.","Provide examples of expected input and output within the prompt.","Avoid mentioning the programming language to allow for more flexible suggestions.","Write the prompt in natural language without any programming language."],a:["B"]},
{t:4,q:"What is zero-shot prompting?",o:["Giving GitHub Copilot examples of the algorithm and outcome you want to use","Only giving GitHub Copilot a question as a prompt and no examples","Giving GitHub Copilot examples of the problem you want to solve","Giving as little context to GitHub Copilot as possible","Telling GitHub Copilot it needs to show only the correct answer"],a:["B"]},
{t:4,q:"What are the different ways to give context to GitHub Copilot to get more precise responses? (Choose two.)",o:["Engage with chat participants such as @workspace to incorporate collaborative context into the responses.","Access developer's previous projects and code repositories to understand their coding style without explicit permission.","Utilize to interpret developer's thoughts and intentions without any code or comments.","Utilize chat variables like #file and #editors to anchor the conversation within the specific context of the files or editors in use."],a:["A","D"]},
{t:4,q:"Select a strategy to increase the performance of GitHub Copilot Chat.",o:["Use a single GitHub Copilot Chat query to find resolutions for the collection of technical requirements","Optimize the usage of memory-intensive operations within generated code","Apply prompt engineering techniques to be more specific","Limit the number of concurrent users accessing GitHub Copilot Chat"],a:["C"]},
{t:4,q:"What is few-shot prompting?",o:["Telling GitHub Copilot to try multiple times to answer the prompt","Telling GitHub Copilot to iterate several times on the answer before returning it to you","Telling GitHub Copilot from which sources it should base the response on","Telling GitHub Copilot about the mechanism you want it to use and how to incorporate that into the response"],a:["D"]},
{t:4,q:"What role does chat history play in GitHub Copilot's code suggestions?",o:["Chat history is irrelevant to GitHub Copilot and does not affect its functionality.","Chat history provides context to GitHub Copilot, improving the relevance and accuracy of its code suggestions.","Chat history is stored and shared with other users to enhance collaboration.","Chat history is used to train the GitHub Copilot model in real-time."],a:["B"]},
{t:4,q:"What are two techniques that can be used to improve prompts to GitHub Copilot? (Choose two.)",o:["Provide specific success criteria","Provide links to supporting documentation","Provide all information about the utilized files","Provide insight on where to get the content from to get a response."],a:["A","C"],w:true},
{t:4,q:"Which of the following describes role prompting?",o:["Describing in your prompt what your role is to get a better suggestion","Tell GitHub Copilot in what tone of voice it should respond","Prompt GitHub Copilot to explain what was the role of a suggestion","Giving GitHub Copilot multiple examples of the form of the data you want to use"],a:["A"]},

{t:5,q:"What is one of the recommended practices when using GitHub Copilot Chat to enhance code quality?",o:["Rely solely on Copilot's suggestions without reviewing them.","Regularly review and refactor the code suggested by Copilot.","Disable Copilot's inline suggestions.","Avoid using Copilot for complex tasks."],a:["B"]},
{t:5,q:"In what ways can GitHub Copilot contribute to the design phase of the Software Development Life Cycle (SDLC)?",o:["GitHub Copilot can generate user interface (UI) prototypes without prompting.","GitHub Copilot can suggest design patterns and best practices relevant to the project.","GitHub Copilot can independently create a complete software design.","GitHub Copilot can manage design team collaboration and version control."],a:["B"]},
{t:5,q:"Are there any limitations to consider when using GitHub Copilot for code refactoring?",o:["GitHub Copilot may not always produce optimized or best-practice code for refactoring.","GitHub Copilot always produces bug-free code during refactoring.","GitHub Copilot understands the context of your entire project and refactors code accordingly.","GitHub Copilot can only be used with a limited set of programming languages."],a:["A"]},
{t:5,q:"How does GitHub Copilot assist developers in minimizing context switching?",o:["GitHub Copilot can predict and prevent bugs before they occur.","GitHub Copilot allows developers to stay in their IDE.","GitHub Copilot can completely replace the need for human collaboration.","GitHub Copilot can automatically handle project management tasks."],a:["B"]},
{t:5,q:"What are the potential limitations of GitHub Copilot in maintaining existing codebases?",o:["GitHub Copilot's suggestions are always aware of the entire codebase.","GitHub Copilot can refactor and optimize the entire codebase up to 10,000 lines of code.","GitHub Copilot can independently manage and resolve all merge conflicts in version control.","GitHub Copilot might not fully understand the context and dependencies within a large codebase."],a:["D"]},
{t:5,q:"How can GitHub Copilot aid developers in writing documentation for their code?",o:["GitHub Copilot can suggest summaries or descriptions based on the code's functionality.","GitHub Copilot can only generate content in markdown format.","GitHub Copilot can automatically generate complete and detailed documentation.","GitHub Copilot cannot assist in writing documentation or comments."],a:["A"]},
{t:5,q:"How does GitHub Copilot assist developers in reducing the amount of manual boilerplate code they write?",o:["By refactoring the entire codebase to eliminate boilerplate code without developer input.","By suggesting code snippets that can be reused across different parts of the project.","By engaging in real-time collaboration with multiple developers to write boilerplate code.","By predicting future coding requirements and pre-emptively generating boilerplate code"],a:["B"]},
{t:5,q:"Which scenarios can GitHub Copilot Chat be used to increase productivity? (Choose two.)",o:["Create a documentation file for the newly created code base.","Fast tracking of release management activities to move code to production main branch.","A project plan for the team needs to be generated using a project management software.","A developer is added to a new project and would like to understand the current software code."],a:["A","D"]},
{t:5,q:"How does GitHub Copilot Chat help to fix security issues in your codebase?",o:["By automatically refactoring the entire codebase to remove vulnerabilities.","By annotating the given suggestions with known vulnerability patterns.","By enforcing strict coding standards that prevent the introduction of vulnerabilities.","By providing detailed reports on the security vulnerabilities present in the codebase."],a:["B"]},
{t:5,q:"Which of the following scenarios best describes the intended use of GitHub Copilot Chat as a tool?",o:["A solution for software development, requiring no additional input or oversight.","A productivity tool that provides suggestions, but relying on human judgement.","A tool solely designed for debugging and error correction.","A complete replacement for developers generating code."],a:["B"]},
{t:5,q:"Which of the following prompts can be used to guide GitHub Copilot Chat in refactoring code for quality improvements? (Choose two.)",o:["\"Suggest ways to enhance the maintainability of this code segment.\"","\"Show me how to improve the readability of this function.\"","\"Refactor my application to meet the latest coding standards.\"","\"Predict future coding trends and update my codebase accordingly.\""],a:["A","C"],w:true},
{t:5,q:"In what way can GitHub Copilot and GitHub Copilot Chat aid developers in modernizing applications?",o:["GitHub Copilot can suggest modern programming patterns based on your code.","GitHub Copilot can create and deploy full-stack applications based on a single query.","GitHub Copilot can automatically refactor applications to align with upcoming standards.","GitHub Copilot can directly convert legacy applications into cloud-native architectures."],a:["A"]},
{t:5,q:"How can GitHub Copilot assist with code refactoring tasks?",o:["GitHub Copilot can remove unnecessary files from the project directory.","GitHub Copilot can suggest refactoring improvements for better code quality.","GitHub Copilot can fix syntax errors without user input.","GitHub Copilot can automatically rewrite code to follow best practices."],a:["D"],w:true},
{t:5,q:"How can GitHub Copilot facilitate a smoother learning experience when diving into a new programming language?",o:["GitHub Copilot's /understand command will help GitHub Copilot understand code written in a targeted programming language.","GitHub Copilot Chat can provide guidance and support for common coding tasks and challenges in the targeted programming language.","GitHub Copilot can convert comments into code to grasp the syntax and nuances of a new programming language.","GitHub Copilot can provide contextualized code suggestions and answer sources from an organization's documentation."],a:["B"]},
{t:5,q:"What method can a developer use to generate sample data with GitHub Copilot? (Choose two.)",o:["Utilize GitHub Copilot's capability to directly access and used databases to create sample data.","Leveraging GitHub Copilot's ability to independently initiate and manage data storage services.","Leveraging GitHub Copilot's suggestions to create a data based on API documentation in the repository.","Utilizing GitHub Copilot's ability to create fictions information from patterns in training data."],a:["C","D"]},
{t:5,q:"How can you use GitHub Copilot to get inline suggestions for refactoring your code? (Choose two.)",o:["By using the \"/fix\" command in GitHub Copilot in-line chat.","By adding comments to your code and triggering a suggestion.","By highlighting the code, you want to fix, right-clicking, and selecting \"Refactor using GitHub Copilot.\"","By highlighting the code you want to fix, right-clicking, and selecting \"Fix using GitHub Copilot.\"","By running the gh copilot fix command."],a:["A","C"],w:true},

{t:6,q:"How can GitHub Copilot assist in maintaining consistency across your tests?",o:["By providing documentation references based on industry best practices.","By automatically fixing all tests in the code based on the context.","By identifying a pattern in the way you write tests and suggesting similar patterns for future tests.","By writing the implementation code for the function based on context"],a:["C"]},

}

function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

哪一種 GitHub Copilot 方案最適合？","o":["GitHub Copilot Individual","GitHub Copilot Enterprise","GitHub Copilot Business","GitHub Copilot Teams","GitHub Copilot Business for non-GHE Customers"]},{"q":"要在使用 GitHub Copilot 時取得 Microsoft 與 GitHub 對於智慧財產權（IP）侵權的保護協助，需要設定什麼？","o":["強制封鎖 MIT 或 GPL 授權的程式碼","啟用 GitHub Copilot 授權檢查","將「符合公開程式碼的建議」設為「封鎖（blocked）」。在接受前你需要自行檢查程式碼建議"]},{"q":"哪一種 GitHub Copilot 方案允許收集提示與建議資料？","o":["GitHub Copilot Individuals","GitHub Copilot Codespace","GitHub Copilot Business","GitHub Copilot Enterprise"]},{"q":"GitHub Copilot Chat 如何協助理解既有的程式碼庫？","o":["透過自動重構程式碼以改善可讀性。","透過提供程式碼結構的視覺化圖表。","透過執行程式碼 linter 與格式化工具。","透過回答關於程式碼的問題並產生解釋。"]},{"q":"GitHub Copilot Individual 如何計費？每個正確答案皆為解答的一部分。（選兩項）","o":["對所有開放原始碼專案免費（不收費）","按月計費，依實際用量的計量服務","以訂閱方式按年計費","以訂閱方式按月計費"]},{"q":"哪些 REST API 端點可用來修改 GitHub Copilot Business 訂閱的詳細資訊？每個正確答案皆為解答的一部分。（選兩項）","o":["為組織新增團隊到 Copilot 訂閱中。","從組織的 Copilot 訂閱中移除團隊。","升級或降級訂閱層級","在 GitHub 組織之間遷移 Copilot 席次指派","根據 GitHub 儲存庫大小重新指派 Copilot 席次"]},{"q":"下列哪一個是存取 GitHub Copilot Business 稽核日誌事件的正確方式？","o":["使用組織 GitHub 設定中的稽核日誌（Audit log）區段","導覽至儲存庫設定中的 Insights 分頁","使用 GitHub 儲存庫中的 Code 分頁","導覽至組織 GitHub 設定中的 Security 分頁"]},{"q":"下列關於 GitHub Copilot 知識庫的敘述，何者正確？","o":["所有檔案類型都會被索引","索引是靜態的","所有儲存庫都會被索引","它是 Enterprise 的功能"]},{"q":"可以使用哪一種方式與 GitHub Copilot 互動？","o":["從 IDE 除錯工作階段中的監看視窗（watch window）","透過正確設定的 GitHub CLI","從網頁瀏覽器前往 https://github.copilot.com","透過 NeoVim 中的聊天功能"]},{"q":"某公司目前將程式碼儲存在 BitBucket，並想使用 GitHub Copilot。哪一種 GitHub Copilot 方案最具成本效益，能讓他們以自己的身分提供者（例如 Okta）來管理使用者？","o":["GitHub Copilot Individual","GitHub Copilot Enterprise","GitHub Copilot Teams","GitHub Copilot Business for non-GHE customers"]},{"q":"GitHub Copilot 在常見程式碼模式上進行訓練，可能會造成什麼影響？","o":["建議全新的專案，同時減少專案上的時間。","建議尚未流行的創新程式設計解決方案。","在提供多元資料集的情況下建議同質性的解決方案。","建議反映訓練資料中最常見實務的程式碼片段。"]},{"q":"對於涉及程式語言已棄用（deprecated）功能或語法的程式碼建議，GitHub Copilot 通常如何處理？","o":["GitHub Copilot 一律過濾掉已棄用的元素，以推廣使用當前標準。","如果已棄用的語法或功能存在於其訓練資料中，GitHub Copilot 可能會建議它們。","GitHub Copilot 拒絕所有涉及已棄用功能的提示，以避免編譯錯誤。","GitHub Copilot 會自動將其建議中已棄用的功能更新為最新版本。"]},{"q":"請辨識 GitHub Copilot 程式碼建議生命週期中涉及的步驟？每個正確答案皆為解答的一部分。（選兩項）","o":["處理遙測資料","產生建議","重新訓練模型","儲存使用者資料","擷取使用者的上下文"]},{"q":"在 GitHub Copilot Chat 的資料流程中，使用者輸入的預先處理扮演什麼角色？","o":["它在向使用者呈現之前格式化輸出回應。","它從使用者的輸入提示中過濾掉不相關的資訊。","它在將輸入提示傳給語言模型之前，以額外的上下文加以豐富。","它直接根據使用者的輸入提示產生回應。"]},{"q":"在 GitHub Copilot 的回應提交給使用者之前，需要通過哪些額外的檢查？每個正確答案皆為解答的一部分。（選兩項）","o":["程式碼品質","與使用者特定設定的相容性","效能基準測試","符合公開程式碼的建議（依設定為選用）"]},{"q":"GitHub Copilot Chat 的潛在限制有哪些？每個正確答案皆為解答的一部分。（選兩項）","o":["處理複雜程式碼結構的能力","有限的訓練資料","對所有程式語言的廣泛支援","程式碼建議中沒有任何偏見"]},{"q":"「Fill-In-the-Middle」（FIM，中間填補）技術對 GitHub Copilot 程式碼建議有什麼影響？","o":["透過同時考量程式碼的前綴與後綴來改善建議，更準確地填補中間的部分。","限制 Copilot 只能使用外部資料庫來產生程式碼建議。","允許 Copilot 僅根據程式碼的前綴來產生建議。","同時忽略程式碼的前綴與後綴，僅以使用者註解作為上下文。"]},{"q":"下列哪些敘述正確描述了 GitHub Copilot Individual 如何使用提示資料？每個正確答案皆為解答的一部分。（選兩項）","o":["即時的使用者輸入有助於產生具上下文感知的程式碼建議。","提示資料由 GitHub 內部用來改善搜尋引擎。","提示資料被用來訓練機器學習模型以提供更好的程式碼建議。","提示資料以未加密的方式儲存，以加快處理速度。"]},{"q":"GitHub Copilot 在 IDE 中使用什麼來判斷提示的上下文？","o":["來自 IDE 的資訊，例如開啟的分頁、游標位置、選取的程式碼。","目前 IDE 中所有可見的程式碼。","目前儲存庫與任何 git 子模組中的所有程式碼。","IDE 中開啟的分頁與終端機的目前資料夾。"]},{"q":"GitHub Copilot 的 LLM 在產生回應時，會從下列何者擷取上下文？","o":["與 IDE 整合的版本控制系統","IDE 中程式碼的語法高亮配色方案","對儲存庫提交（commit）的頻率","專案中相鄰或相關的檔案"]},{"q":"在 GitHub Copilot 中使用自訂模型（custom models）有什麼好處？","o":["回應使用組織的 LLM 引擎","回應產生得更快、出現得更早","回應保證是正確的","回應採用你儲存庫中的實務與模式"]},{"q":"GitHub Copilot 如何辨識相符的程式碼，並確保公開程式碼被適當地處理或封鎖？每個正確答案皆為解答的一部分。（選兩項）","o":["實施防護機制以偵測並避免建議來自公開程式碼的逐字片段","過濾掉與公開儲存庫程式碼相符的建議","使用僅以私有儲存庫訓練的機器學習模型","審查並儲存使用者特定的私有儲存庫資料，以供未來建議使用"]},{"q":"GitHub Copilot 如何運用聊天記錄來強化其程式碼補全能力？","o":["透過與第三方服務共享聊天記錄，以改善整合與功能。","透過分析過去的聊天互動，找出常見的程式設計模式與錯誤。","透過記錄聊天記錄來監控使用者活動並確保符合程式設計標準。","透過使用聊天記錄，根據先前的提示提供個人化的程式碼片段。"]},{"q":"GitHub Copilot 中重複偵測過濾器（duplication detection filter）的主要目的是什麼？","o":["將使用者產生的程式碼與私有儲存庫比對以找出潛在相符項目。","鼓勵使用者遵循程式設計最佳實務以防止程式碼重複。","讓管理員可依自訂條件控制哪些建議對開發者可見。","偵測並封鎖與 GitHub 上公開程式碼片段相符的建議（若其包含約 150 個字元）。"]},{"q":"代理服務（proxy service）託管於何處？","o":["Amazon Web Service","自行託管","Microsoft Azure","Google Cloud Platform"]},{"q":"在軟體開發生命週期（SDLC）的需求分析階段，GitHub Copilot 如何協助開發者？","o":["透過管理利害關係人的溝通與會議。","透過自動產生詳細的需求文件。","透過提供有助於記載需求的範本與程式碼片段。","透過在使用 /help 時辨識並修正潛在的需求衝突。"]},{"q":"你要如何改善 GitHub Copilot 所使用的上下文？每個正確答案皆為解答的一部分。（選兩項）","o":["在你的提示中加入變數（#selection）","在你的提示中加入重要檔案的完整檔案路徑","將重要檔案加入你的 .gitconfig","在你的 IDE 中開啟相關的分頁"]},{"q":"在為 GitHub Copilot 撰寫提示時，有哪一項建議的策略可提升所產生程式碼的相關性？","o":["讓提示盡可能簡短，使用單字或簡短的片語。","在提示中提供預期輸入與輸出的範例。","避免提及程式語言，以容許更彈性的建議。","以自然語言撰寫提示，不使用任何程式語言。"]},{"q":"什麼是零樣本提示（zero-shot prompting）？","o":["給 GitHub Copilot 提供你想使用的演算法與結果範例","只給 GitHub Copilot 一個問題作為提示，不提供任何範例","給 GitHub Copilot 提供你想解決問題的範例","給 GitHub Copilot 盡可能少的上下文","告訴 GitHub Copilot 它只需要顯示正確答案"]},{"q":"要讓 GitHub Copilot 得到更精準的回應，有哪些不同的方式可提供上下文？每個正確答案皆為解答的一部分。（選兩項）","o":["使用如 @workspace 這類聊天參與者，將協作上下文納入回應中。","在未取得明確許可的情況下，存取開發者先前的專案與程式碼儲存庫以了解其程式設計風格。","在沒有任何程式碼或註解的情況下解讀開發者的想法與意圖。","使用如 #file 與 #editors 這類聊天變數，將對話錨定在所使用檔案或編輯器的特定上下文中。"]},{"q":"請選出一項可提升 GitHub Copilot Chat 表現的策略。","o":["使用單一次 GitHub Copilot Chat 查詢，來為一整組技術需求尋找解決方案","最佳化所產生程式碼中記憶體密集型操作的使用","運用提示工程技巧讓敘述更具體","限制同時存取 GitHub Copilot Chat 的使用者數量"]},{"q":"什麼是少樣本提示（few-shot prompting）？","o":["告訴 GitHub Copilot 多次嘗試回答該提示","告訴 GitHub Copilot 在回傳答案前對答案反覆迭代數次","告訴 GitHub Copilot 它應依據哪些來源來產生回應","告訴 GitHub Copilot 你希望它使用的機制，以及如何將其納入回應中"]},{"q":"聊天記錄在 GitHub Copilot 的程式碼建議中扮演什麼角色？","o":["聊天記錄與 GitHub Copilot 無關，也不影響其功能。","聊天記錄為 GitHub Copilot 提供上下文，改善其程式碼建議的相關性與準確性。","聊天記錄會被儲存並與其他使用者共享以加強協作。","聊天記錄被用來即時訓練 GitHub Copilot 模型。"]},{"q":"有哪兩種技巧可用來改善給 GitHub Copilot 的提示？（選兩項）","o":["提供具體的成功標準","提供支援文件的連結","提供關於所使用檔案的所有資訊","提供關於從何處取得內容以獲得回應的洞察。"]},{"q":"下列何者描述了角色提示（role prompting）？","o":["在你的提示中描述你的角色是什麼，以獲得更好的建議","告訴 GitHub Copilot 它應該以什麼語氣回應","提示 GitHub Copilot 解釋某個建議的角色為何","給 GitHub Copilot 提供多個你想使用資料形式的範例"]},{"q":"在程式碼重構的過程中，GitHub Copilot 可以用哪些方式支援開發者？每個正確答案皆為解答的一部分。（選兩項）","o":["根據最佳實務提供改善程式碼可讀性與可維護性的建議。","提供能提升效能並降低複雜度的程式碼轉換範例。","獨立確保跨產業符合法規標準。","自主地將整個程式碼庫重構為最新的程式語言。"]},{"q":"使用 GitHub Copilot Chat 來提升程式碼品質時，建議的做法之一是什麼？","o":["完全依賴 Copilot 的建議而不加以審查。","定期審查並重構 Copilot 所建議的程式碼。","停用 Copilot 的行內建議。","避免將 Copilot 用於複雜的任務。"]},{"q":"在軟體開發生命週期（SDLC）的設計階段，GitHub Copilot 可以用哪些方式做出貢獻？","o":["GitHub Copilot 可在無需提示的情況下產生使用者介面（UI）原型。","GitHub Copilot 可建議與專案相關的設計模式與最佳實務。","GitHub Copilot 可獨立建立一個完整的軟體設計。","GitHub Copilot 可管理設計團隊的協作與版本控制。"]},{"q":"使用 GitHub Copilot 進行程式碼重構時，是否有任何需要考量的限制？","o":["GitHub Copilot 重構時不一定總能產生最佳化或符合最佳實務的程式碼。","GitHub Copilot 在重構時總是能產生無錯誤的程式碼。","GitHub Copilot 了解你整個專案的上下文並據此重構程式碼。","GitHub Copilot 只能用於有限的幾種程式語言。"]},{"q":"GitHub Copilot 如何協助開發者最小化情境切換（context switching）？","o":["GitHub Copilot 可在錯誤發生之前預測並防止它們。","GitHub Copilot 讓開發者得以停留在他們的 IDE 中。","GitHub Copilot 可完全取代對人類協作的需求。","GitHub Copilot 可自動處理專案管理任務。"]},{"q":"在維護既有程式碼庫方面，GitHub Copilot 有哪些潛在限制？","o":["GitHub Copilot 的建議總是能感知整個程式碼庫。","GitHub Copilot 可重構並最佳化整個程式碼庫，最多達 10,000 行程式碼。","GitHub Copilot 可獨立管理並解決版本控制中的所有合併衝突。","GitHub Copilot 可能無法完全理解大型程式碼庫中的上下文與相依關係。"]},{"q":"GitHub Copilot 如何協助開發者為其程式碼撰寫文件？","o":["GitHub Copilot 可根據程式碼的功能建議摘要或描述。","GitHub Copilot 只能以 markdown 格式產生內容。","GitHub Copilot 可自動產生完整且詳細的文件。","GitHub Copilot 無法協助撰寫文件或註解。"]},{"q":"GitHub Copilot 如何協助開發者減少手動撰寫的樣板程式碼（boilerplate code）數量？","o":["透過在無需開發者輸入的情況下重構整個程式碼庫以消除樣板程式碼。","透過建議可在專案不同部分重複使用的程式碼片段。","透過與多位開發者進行即時協作來撰寫樣板程式碼。","透過預測未來的程式設計需求並預先產生樣板程式碼。"]},{"q":"在哪些情境中可以使用 GitHub Copilot Chat 來提升生產力？每個正確答案皆為解答的一部分。（選兩項）","o":["為新建立的程式碼庫建立一份文件檔案。","加速發布管理活動以將程式碼移至生產環境的主分支。","需要使用專案管理軟體為團隊產生專案計畫。","一位開發者被加入新專案，想要了解目前的軟體程式碼。"]},{"q":"GitHub Copilot Chat 如何協助修復你程式碼庫中的安全性問題？","o":["透過自動重構整個程式碼庫以移除弱點。","透過以已知的弱點模式為所給建議加上標註。","透過強制執行嚴格的程式設計標準以防止引入弱點。","透過提供關於程式碼庫中現有安全性弱點的詳細報告。"]},{"q":"下列哪一個情境最能描述 GitHub Copilot Chat 作為工具的預期用途？","o":["一個用於軟體開發的解決方案，不需要任何額外的輸入或監督。","一個提供建議但仍仰賴人類判斷的生產力工具。","一個僅為除錯與錯誤修正而設計的工具。","一個能完全取代開發者來產生程式碼的替代品。"]},{"q":"下列哪些提示可用來引導 GitHub Copilot Chat 進行程式碼重構以改善品質？每個正確答案皆為解答的一部分。（選兩項）","o":["「建議幾種方式來提升這段程式碼的可維護性。」","「示範如何改善這個函式的可讀性。」","「重構我的應用程式以符合最新的程式設計標準。」","「預測未來的程式設計趨勢並據此更新我的程式碼庫。」"]},{"q":"GitHub Copilot 與 GitHub Copilot function refreshHome(){
  document.getElementById("countVal").textContent=countPerSession;
  const seen=Object.keys(store.perQ).length;
  let totalAttempt=0,totalCorrect=0;
  for(const id in store.perQ){ const r=store.perQ[id]; totalAttempt+=r.seen; totalCorrect+=r.correct; }
  document.getElementById("sumSeen").textContent=seen;
  document.getElementById("sumAcc").textContent=totalAttempt? Math.round(totalCorrect/totalAttempt*100)+"%":"–";
  document.getElementById("sumSessions").textContent=store.sessions.length;
  const wrongCount=wrongQuestionIds().length;
  const badge=document.getElementById("wrongBadge");
  const modeWrong=document.getElementById("modeWrong");
  if(wrongCount>0){ badge.textContent=wrongCount; badge.style.display="block"; modeWrong.disabled=false; }
  else{ badge.style.display="none"; modeWrong.disabled=true; }
}
function changeCount(d){
  countPerSession=Math.max(5,Math.min(50,countPerSession+d));
  store.settings.count=countPerSession; saveStore();
  document.getElementById("countVal").textContent=countPerSession;
}
function toggleTheme(){
  const html=document.documentElement;
  const dark=html.getAttribute("data-theme")==="dark";
  html.setAttribute("data-theme", dark?"light":"dark");
  document.getElementById("themeBtn").textContent= dark?"◐ 深色":"◑ 淺色";
  try{ localStorage.setItem("gh300_theme", dark?"light":"dark"); }catch(e){}
}
(function initTheme(){
  let t="light"; try{ t=localStorage.getItem("gh300_theme")||"light"; }catch(e){}
  document.documentElement.setAttribute("data-theme",t);
  document.getElementById("themeBtn").textContent= t==="dark"?"◑ 淺色":"◐ 深色";
})();

function wrongQuestionIds(){
  const ids=[];
  for(const id in store.perQ){ if(store.perQ[id].wrong>0) ids.push(id); }
  ids.sort((a,b)=> store.perQ[b].wrong - store.perQ[a].wrong);
  return ids;
}

function renderBrowse(){
  const term=(document.getElementById("browseSearch").value||"").trim().toLowerCase();
  const list=document.getElementById("browseList"); list.innerHTML="";
  let shown=0;
  QUESTIONS.forEach((q)=>{
    if(browseTopic!=="all" && String(q.t)!==String(browseTopic)) return;
    if(term){
      const hay=(q.q+" "+(q.zh||"")+" "+q.o.join(" ")+" "+((q.oz||[]).join(" "))).toLowerCase();
      if(hay.indexOf(term)<0) return;
    }
    shown++;
    const card=document.createElement("div"); card.className="browse-card";
    let html='<div class="b-meta"><span class="tag">Topic '+q.t+'</span>';
    if(q.a.length>1) html+='<span class="tag" style="background:var(--accent-soft);color:var(--accent)">複選 '+q.a.length+'</span>';
    if(q.w) html+='<span class="tag warn">⚠ 答案有爭議</span>';
    html+='</div>';
    html+='<div class="b-q-en">'+escapeHtml(q.q)+'</div>';
    if(q.zh) html+='<div class="b-q-zh">'+escapeHtml(q.zh)+'</div>';
    q.o.forEach((opt,oi)=>{
      const key=LETTERS[oi];
      const correct=q.a.includes(key);
      html+='<div class="b-opt'+(correct?' correct':'')+'"><span class="b-key">'+key+'</span><span class="b-otext"><span class="en">'+escapeHtml(opt)+'</span>'+((q.oz&&q.oz[oi])?'<span class="zh">'+escapeHtml(q.oz[oi])+'</span>':'')+'</span></div>';
    });
    html+='<div class="b-ans">正確答案：'+q.a.join("、")+'</div>';
    card.innerHTML=html;
    list.appendChild(card);
  });
  document.getElementById("browseCount").textContent=shown+" 題";
  if(shown===0) list.innerHTML='<div class="card"><div class="empty">找不到符合的題目</div></div>';
}

/* ============ 智慧出題 40/40/20 ============ */
function pickSmart(N){
  const wrong=[],normal=[],fresh=[];
  QUESTIONS.forEach(q=>{
    const r=store.perQ[q.id];
    if(!r) fresh.push(q);
    else if(r.wrong>0) wrong.push(q);
    else normal.push(q);
  });
  const need={ wrong:Math.round(N*0.4), normal:Math.round(N*0.4) };
  need.fresh = N - need.wrong - need.normal;
  const pools={ wrong:shuffle(wrong), normal:shuffle(normal), fresh:shuffle(fresh) };
  const chosen=[];
  ["wrong","normal","fresh"].forEach(k=>{ chosen.push(...pools[k].splice(0, Math.min(need[k], pools[k].length))); });
  let remaining=N-chosen.length;
  if(remaining>0){
    const leftover=shuffle([...pools.wrong,...pools.normal,...pools.fresh]);
    chosen.push(...leftover.slice(0,remaining));
  }
  return shuffle(chosen).slice(0,N);
}

/* ============ 開始練習 ============ */
function start(mode, topic){
  let pool=[];
  if(mode==="random") pool=pickSmart(countPerSession);
  else if(mode==="topic") pool=shuffle(QUESTIONS.filter(q=>q.t===topic)).slice(0,countPerSession);
  else if(mode==="wrong"){
    const ids=wrongQuestionIds();
    if(ids.length===0){ refreshHome(); return; }
    const picked=ids.slice(0, Math.min(ids.length, countPerSession));
    pool=shuffle(picked.map(id=>QUESTIONS.find(q=>q.id===id)));
  }
  if(pool.length===0) return;
  session={ mode, topic, idx:0,
    items: pool.map(q=>{
      const order=shuffle(q.o.map((text,i)=>({text, key:LETTERS[i]})));
      return { q, order, selected:[], answered:false, correct:null };
    })
  };
  renderQuestion();
  show("quiz");
}

function renderQuestion(){
  const it=session.items[session.idx];
  const q=it.q;
  const total=session.items.length;
  const answeredCount=session.items.filter(i=>i.answered).length;
  document.getElementById("qIdx").textContent=(session.idx+1)+" / "+total;
  document.getElementById("pbarFill").style.width=(answeredCount/total*100)+"%";
  document.getElementById("qTopic").textContent="Topic "+q.t;
  document.getElementById("qWarn").classList.toggle("hidden", !q.w);
  document.getElementById("qText").textContent=q.q;

  const isMulti=q.a.length>1;
  const multiHint=document.getElementById("qMulti");
  if(isMulti){ multiHint.textContent=`// 複選題：請選 ${q.a.length} 項（需全對才算對）`; multiHint.classList.remove("hidden"); }
  else multiHint.classList.add("hidden");

  const opts=document.getElementById("qOpts"); opts.innerHTML="";
  it.order.forEach((o,displayI)=>{
    const b=document.createElement("button");
    b.className="opt"; b.dataset.key=o.key;
    b.innerHTML=`<span class="k">${LETTERS[displayI]}</span><span>${escapeHtml(o.text)}</span>`;
    if(it.answered){
      b.classList.add("locked");
      if(q.a.includes(o.key)) b.classList.add("correct");
      else if(it.selected.includes(o.key)) b.classList.add("wrong");
    }else{
      if(it.selected.includes(o.key)) b.classList.add("sel");
      b.onclick=()=>toggleSelect(o.key,b,isMulti);
    }
    opts.appendChild(b);
  });

  const fb=document.getElementById("qFeedback");
  const submitBtn=document.getElementById("submitBtn");
  if(it.answered){
    fb.className= it.correct? "feedback show ok":"feedback show no";
    document.getElementById("fbIcon").textContent= it.correct? "✓":"✕";
    if(it.correct) document.getElementById("fbText").textContent="答對了";
    else{
      const ansLetters=it.order.map((o,i)=> q.a.includes(o.key)? LETTERS[i]:null).filter(Boolean).join("、");
      document.getElementById("fbText").textContent="答錯，正確答案："+ansLetters;
    }
    submitBtn.classList.add("hidden");
  }else{
    fb.className="feedback";
    submitBtn.classList.remove("hidden");
    submitBtn.disabled= it.selected.length===0;
  }

  // 導覽按鈕
  document.getElementById("prevBtn").disabled = session.idx===0;
  document.getElementById("nextBtn").textContent = (session.idx===total-1)? "看結果 →":"下一題 →";
}

function toggleSelect(key, el, isMulti){
  const it=session.items[session.idx];
  if(it.answered) return;
  if(isMulti){
    const i=it.selected.indexOf(key);
    if(i>=0){ it.selected.splice(i,1); el.classList.remove("sel"); }
    else{ it.selected.push(key); el.classList.add("sel"); }
  }else{
    it.selected=[key];
    document.querySelectorAll("#qOpts .opt").forEach(o=>o.classList.remove("sel"));
    el.classList.add("sel");
  }
  document.getElementById("submitBtn").disabled= it.selected.length===0;
}

function submitAnswer(){
  const it=session.items[session.idx];
  if(it.selected.length===0 || it.answered) return;
  const q=it.q;
  it.answered=true;
  it.correct=setsEqual(it.selected, q.a);
  if(!store.perQ[q.id]) store.perQ[q.id]={seen:0,correct:0,wrong:0};
  store.perQ[q.id].seen++;
  if(it.correct) store.perQ[q.id].correct++; else store.perQ[q.id].wrong++;
  saveStore();
  renderQuestion();
}

function prevQuestion(){ if(session.idx>0){ session.idx--; renderQuestion(); window.scrollTo(0,0); } }
function nextQuestion(){
  if(session.idx < session.items.length-1){ session.idx++; renderQuestion(); window.scrollTo(0,0); }
  else finishWithCheck();
}
function finishWithCheck(){
  const skipped=session.items.filter(i=>!i.answered).length;
  if(skipped>0){
    uiConfirm(`還有 ${skipped} 題未作答（不會計分）。確定要看成績嗎？`, finishSession);
  }else finishSession();
}

function recordSession(){
  const answered=session.items.filter(i=>i.answered).length;
  const correct=session.items.filter(i=>i.answered&&i.correct).length;
  store.sessions.push({ date:Date.now(), mode:session.mode, total:answered, correct });
  saveStore();
}

function finishSession(){
  recordSession();
  const total=session.items.length;
  const answered=session.items.filter(i=>i.answered).length;
  const correct=session.items.filter(i=>i.answered&&i.correct).length;
  const skipped=total-answered;
  const pct= answered? Math.round(correct/answered*100):0;
  document.getElementById("ring").style.setProperty("--p",pct);
  document.getElementById("ringPct").textContent=pct+"%";
  document.getElementById("resScore").textContent=correct+" / "+answered;
  document.getElementById("resSub").textContent= pct>=90?"表現優異 🎯": pct>=70?"不錯，再加強錯題":"建議多複習錯題";
  const skipEl=document.getElementById("resSkip");
  if(skipped>0){ skipEl.textContent=`（跳過 ${skipped} 題，未計分）`; skipEl.classList.remove("hidden"); }
  else skipEl.classList.add("hidden");

  const wrongItems=session.items.filter(i=>i.answered&&!i.correct);
  const reviewCard=document.getElementById("reviewCard");
  const list=document.getElementById("reviewList"); list.innerHTML="";
  if(wrongItems.length===0){
    reviewCard.classList.add("hidden");
    document.getElementById("retryWrongBtn").classList.add("hidden");
  }else{
    reviewCard.classList.remove("hidden");
    document.getElementById("retryWrongBtn").classList.remove("hidden");
    wrongItems.forEach(it=>{
      const q=it.q;
      const yourTxt=it.selected.map(k=> q.o[LETTERS.indexOf(k)]).join("、");
      const ansTxt=q.a.map(k=> q.o[LETTERS.indexOf(k)]).join("、");
      const div=document.createElement("div");
      div.className="review-item";
      div.innerHTML=`<div class="review-q">${escapeHtml(q.q)}</div>
        <div class="review-line you"><span class="lab">你選</span><span class="val">${escapeHtml(yourTxt)}</span></div>
        <div class="review-line ans"><span class="lab">正解</span><span class="val">${escapeHtml(ansTxt)}</span></div>`;
      list.appendChild(div);
    });
  }
  show("result");
}

/* ============ 統計表 ============ */
function showStats(){
  let totalAttempt=0,totalCorrect=0;
  for(const id in store.perQ){ totalAttempt+=store.perQ[id].seen; totalCorrect+=store.perQ[id].correct; }
  document.getElementById("stSeen").textContent=Object.keys(store.perQ).length;
  document.getElementById("stAcc").textContent= totalAttempt? Math.round(totalCorrect/totalAttempt*100)+"%":"–";
  document.getElementById("stAttempts").textContent=totalAttempt;

  const ts=document.getElementById("topicStats"); ts.innerHTML="";
  for(const t in TOPICS){
    let att=0,cor=0;
    QUESTIONS.filter(q=>q.t==Number(t)).forEach(q=>{ const r=store.perQ[q.id]; if(r){ att+=r.seen; cor+=r.correct; } });
    const pct= att? Math.round(cor/att*100):null;
    const color= pct===null? "var(--line)" : pct>=80?"var(--green)": pct>=50?"var(--amber)":"var(--red)";
    const div=document.createElement("div");
    div.className="topicbar";
    div.innerHTML=`<div class="tb-head"><span>${t}. ${escapeHtml(TOPICS[t])}</span><span class="pct">${pct===null?"未練習":pct+"%"}</span></div>
      <div class="tb-track"><i style="width:${pct||0}%;background:${color}"></i></div>`;
    ts.appendChild(div);
  }

  const ml=document.getElementById("missedList"); ml.innerHTML="";
  const missed=Object.keys(store.perQ).filter(id=>store.perQ[id].wrong>0)
    .sort((a,b)=>store.perQ[b].wrong-store.perQ[a].wrong).slice(0,10);
  if(missed.length===0){ ml.innerHTML='<div class="empty">目前沒有錯題紀錄，繼續練習吧！</div>'; }
  else missed.forEach(id=>{
    const q=QUESTIONS.find(x=>x.id===id); const r=store.perQ[id];
    const div=document.createElement("div"); div.className="missed-item";
    div.innerHTML=`<span class="missed-cnt">錯 ${r.wrong}</span><span class="missed-q">${escapeHtml(q.q)}</span>`;
    ml.appendChild(div);
  });
  show("stats");
}

function resetStats(){
  uiConfirm("確定要清除所有作答與統計紀錄嗎？此動作無法復原。", function(){
    store={settings:{count:countPerSession}, perQ:{}, sessions:[]};
    saveStore();
    refreshHome();
    if(!document.getElementById("stats").classList.contains("hidden")) showStats();
  });
}

/* ============ 自製確認視窗（沙箱環境不支援原生 confirm）============ */
let _confirmCb=null;
function uiConfirm(msg, onYes){
  _confirmCb=onYes;
  document.getElementById("modalMsg").textContent=msg;
  document.getElementById("modalOverlay").classList.add("open");
}
function modalYes(){
  document.getElementById("modalOverlay").classList.remove("open");
  const cb=_confirmCb; _confirmCb=null; if(cb) cb();
}
function modalNo(){
  document.getElementById("modalOverlay").classList.remove("open");
  _confirmCb=null;
}

refreshHome();
</script>

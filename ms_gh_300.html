<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GH-300 模擬測驗</title>
<style>
/* Fluent-style: Segoe UI, #0078D4 accent, neutral greys, 4px corners, subtle elevation. Domain colors from the Microsoft palette. */
:root{
  --bg:#f3f2f1; --card:#ffffff; --ink:#201f1e; --muted:#605e5c; --line:#e1dfdd; --line-strong:#8a8886;
  --accent:#0078d4; --accent-hover:#106ebe; --accent-ink:#ffffff; --tint:#eff6fc;
  --good:#107c10; --good-bg:#dff6dd; --bad:#a4262c; --bad-bg:#fde7e9; --warn:#7a5900; --warn-bg:#fff4ce;
  --d1:#107c10; --d2:#8764b8; --d3:#0078d4; --d4:#ffb900; --d5:#038387; --d6:#d13438;
  --shadow:0 1.6px 3.6px rgba(0,0,0,.13),0 .3px .9px rgba(0,0,0,.1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b1a19; --card:#292827; --ink:#f3f2f1; --muted:#c8c6c4; --line:#3b3a39; --line-strong:#8a8886;
  --accent:#479ef5; --accent-hover:#6cb8f6; --accent-ink:#0b1117; --tint:#1f2b38;
  --good:#6ccb5f; --good-bg:#1b3a1a; --bad:#f1707b; --bad-bg:#3b1a1c; --warn:#fce100; --warn-bg:#3d3200;
  --d1:#6ccb5f; --d2:#b4a0ff; --d3:#479ef5; --d4:#ffb900; --d5:#4cc2c6; --d6:#f1707b;
  --shadow:0 1.6px 3.6px rgba(0,0,0,.5);}}
:root[data-theme="dark"]{
  --bg:#1b1a19; --card:#292827; --ink:#f3f2f1; --muted:#c8c6c4; --line:#3b3a39; --line-strong:#8a8886;
  --accent:#479ef5; --accent-hover:#6cb8f6; --accent-ink:#0b1117; --tint:#1f2b38;
  --good:#6ccb5f; --good-bg:#1b3a1a; --bad:#f1707b; --bad-bg:#3b1a1c; --warn:#fce100; --warn-bg:#3d3200;
  --d1:#6ccb5f; --d2:#b4a0ff; --d3:#479ef5; --d4:#ffb900; --d5:#4cc2c6; --d6:#f1707b;
  --shadow:0 1.6px 3.6px rgba(0,0,0,.5);}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI","Segoe UI Variable","Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.6}
body{padding:0 16px 96px}
.hdr{background:var(--card);border-bottom:1px solid var(--line);margin:0 -16px 16px;padding:10px 16px;box-shadow:var(--shadow)}
.hdr .in{max-width:760px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
.hdr b{font-weight:600;font-size:1rem}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:1.6rem;font-weight:600;margin:8px 0 4px;text-wrap:balance}
h2{font-size:1.05rem;font-weight:600;margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 16px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.chip{display:flex;gap:10px;align-items:center;text-align:left;width:100%;min-height:52px;padding:10px 12px;border:1px solid var(--line-strong);border-radius:4px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.chip:hover{background:var(--bg)}
.chip .dot{width:12px;height:12px;background:var(--c);flex:none;opacity:.4}
.chip .t{flex:1;font-weight:600;font-size:.95rem}
.chip .t small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--tint);box-shadow:inset 0 0 0 1px var(--accent)}
.chip[aria-pressed="true"] .dot{opacity:1}
button,input{font:inherit}
.btn{min-height:44px;padding:8px 18px;border-radius:4px;border:1px solid var(--line-strong);background:var(--card);color:var(--ink);font-weight:600;cursor:pointer}
.btn:hover:not(:disabled){background:var(--bg)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover:not(:disabled){background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.small{min-height:36px;padding:4px 12px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.chip:focus-visible,.opt:focus-within,input:focus-visible,.theme:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.presets{display:flex;flex-wrap:wrap;gap:8px}
.presets .btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
input[type=number]{width:96px;min-height:44px;padding:6px 10px;border-radius:4px;border:1px solid var(--line-strong);background:var(--card);color:var(--ink)}
input[type=checkbox],input[type=radio]{accent-color:var(--accent)}
label.sw{display:flex;gap:10px;align-items:flex-start;padding:8px 0;cursor:pointer}
label.sw input{width:20px;height:20px;margin-top:3px;flex:none}
.hint{color:var(--muted);font-size:.85rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;font-size:.9rem;color:var(--muted)}
.bar{height:4px;background:var(--line);overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.tag{display:inline-flex;align-items:center;padding:2px 10px;border-radius:2px;font-size:.78rem;font-weight:600;color:var(--ink);background:var(--bg);border:1px solid var(--line);margin-right:8px}
.tag::before{content:"";width:8px;height:8px;background:var(--c);margin-right:6px}
.qtext{font-size:1.08rem;font-weight:600;margin:10px 0 6px;overflow-wrap:anywhere}
.need{color:var(--accent);font-size:.9rem;font-weight:600;margin-bottom:8px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line-strong);border-radius:4px;cursor:pointer;background:var(--card);overflow-wrap:anywhere}
.opt:hover:not(.locked){background:var(--bg)}
.opt input{width:20px;height:20px;margin-top:2px;flex:none}
.opt .k{font-weight:600;color:var(--muted);flex:none;width:1.4em}
.opt.sel{border-color:var(--accent);background:var(--tint);box-shadow:inset 0 0 0 1px var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-bg);box-shadow:inset 0 0 0 1px var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);box-shadow:inset 0 0 0 1px var(--bad)}
.opt.missed{border-color:var(--good);border-style:dashed;background:var(--card)}
.opt.locked{cursor:default}
.fb{margin-top:14px;padding:12px 14px;border-radius:4px;font-size:.95rem}
.fb.ok{background:var(--good-bg);color:var(--good)}
.fb.no{background:var(--bad-bg);color:var(--bad)}
.fb b{display:block;margin-bottom:2px}
.note{margin-top:10px;padding:10px 14px;border-radius:4px;font-size:.9rem;background:var(--warn-bg);color:var(--warn)}
.note.good{background:var(--good-bg);color:var(--good)}
.note.bad{background:var(--bad-bg);color:var(--bad)}
.actions{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);box-shadow:0 -1.6px 3.6px rgba(0,0,0,.08)}
.actions .in{max-width:760px;margin:0 auto;display:flex;gap:10px}
.actions .btn{flex:1}
.score{font-size:3rem;font-weight:600;line-height:1.1;margin:4px 0;color:var(--accent)}
.dom{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;margin:10px 0}
.dom .m{grid-column:1/-1;height:6px;background:var(--line);overflow:hidden}
.dom .m i{display:block;height:100%;background:var(--c)}
.wl{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.wl li{padding:10px 12px;border:1px solid var(--line);border-radius:4px;font-size:.92rem;overflow-wrap:anywhere}
.wl li small{display:block;color:var(--muted);margin-top:4px}
.theme{white-space:nowrap;background:none;border:none;color:var(--accent);cursor:pointer;font-size:.85rem;padding:6px;font-weight:600}
@media (min-width:640px){body{padding:0 24px 110px}.hdr{margin:0 -24px 24px;padding:10px 24px}.card{padding:22px}h1{font-size:1.9rem}.qtext{font-size:1.15rem}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
<script>(function(){var t="dark";try{t=localStorage.getItem("gh300_theme")||"dark"}catch(e){}document.documentElement.dataset.theme=t==="light"?"light":"dark"})()</script>
</head>
<body>
<header class="hdr"><div class="in"><b>GH-300 模擬測驗</b><button class="theme" id="th" type="button">切換深色／淺色</button></div></header>
<div class="wrap" id="app"></div>
<script src="ms_gh300.js"></script>
<script>
const DOM={1:{n:"D1 負責任 AI",w:"15–20%",c:"var(--d1)"},2:{n:"D2 Copilot 功能",w:"25–30%",c:"var(--d2)"},3:{n:"D3 資料與架構",w:"10–15%",c:"var(--d3)"},4:{n:"D4 Prompt 與 context",w:"10–15%",c:"var(--d4)"},5:{n:"D5 生產力、測試、安全",w:"10–15%",c:"var(--d5)"},6:{n:"D6 隱私與防護",w:"10–15%",c:"var(--d6)"}};
const STL={V:["已對照官方來源","good"],R:["","" ],O:["此題內容已過時","warn"],P:["此題答案待查或有爭議","warn"],X:["此題答案有誤或題目有瑕疵","bad"]};
const Q=window.MS_GH300||[];
const KEY="gh300_wrong_v1";
let mem=[];
function loadWrong(){try{const v=JSON.parse(localStorage.getItem(KEY)||"[]");return Array.isArray(v)?v:mem}catch(e){return mem}}
function saveWrong(a){mem=a;try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const app=document.getElementById("app");
if(!Q.length){document.getElementById("app").innerHTML="<p>找不到題庫檔 ms_gh300.js，請確認它與本檔案放在同一個資料夾。</p>"}
const SRC={A:{n:"來源 A：舊題庫",s:"原 ms_gh300.js，已移除與來源 B 重複的 5 題"},B:{n:"來源 B：新題庫",s:"GH-300_Question_Bank（清理後 122 題）"}};
const sv=q=>q.src||(q.n>126?"B":"A");
const cfg={srcs:new Set(["A","B"]),doms:new Set([1,2,3,4,5,6]),count:20,shuffleOpts:false,incBad:false};
let S=null;

function pool(){return Q.filter(q=>cfg.srcs.has(sv(q))&&cfg.doms.has(q.d)&&(cfg.incBad||q.s!=="X"))}

function setup(){
  S=null;
  const wrong=loadWrong().filter(n=>Q.some(q=>q.n===n));
  const avail=pool().length;
  if(cfg.count>avail)cfg.count=Math.max(1,avail);
  const cnt=d=>Q.filter(q=>cfg.srcs.has(sv(q))&&q.d===d&&(cfg.incBad||q.s!=="X")).length;
  const scnt=k=>Q.filter(q=>sv(q)===k&&(cfg.incBad||q.s!=="X")).length;
  app.innerHTML=`
  <h1>開始練習</h1>
  <p class="sub">GitHub Copilot 認證題庫，共 ${Q.length} 題。選擇主題與題數後開始，答錯的題目會存進錯題本。</p>
  <section class="card"><h2>1. 題庫來源</h2>
    <div class="chips">${Object.entries(SRC).map(([k,v])=>`<button type="button" class="chip srcchip" data-s="${k}" aria-pressed="${cfg.srcs.has(k)}"><span class="dot"></span><span class="t">${v.n}<small>${v.s}・${scnt(k)} 題</small></span></button>`).join("")}</div>
  </section>
  <section class="card"><h2>2. 考試主題</h2>
    <div class="chips">${Object.entries(DOM).map(([k,v])=>`<button type="button" class="chip" style="--c:${v.c}" data-d="${k}" aria-pressed="${cfg.doms.has(+k)}"><span class="dot"></span><span class="t">${v.n}<small>占比 ${v.w}・${cnt(+k)} 題</small></span></button>`).join("")}</div>
    <div class="row" style="margin-top:10px"><button type="button" class="btn small" id="all">全選</button><button type="button" class="btn small" id="none">全不選</button></div>
  </section>
  <section class="card"><h2>3. 題數</h2>
    <div class="presets" id="pre">${[10,20,30,50].map(n=>`<button type="button" class="btn small" data-n="${n}" aria-pressed="${cfg.count===n}">${n} 題</button>`).join("")}<button type="button" class="btn small" data-n="all" aria-pressed="${cfg.count===avail&&![10,20,30,50].includes(avail)}">全部</button></div>
    <div class="row" style="margin-top:10px"><label for="cnt">自訂題數</label><input id="cnt" type="number" min="1" max="${Math.max(avail,1)}" value="${cfg.count}" inputmode="numeric"><span class="hint">目前條件下共 ${avail} 題可抽</span></div>
  </section>
  <section class="card"><h2>4. 選項</h2>
    <label class="sw"><input type="checkbox" id="so" ${cfg.shuffleOpts?"checked":""}><span>隨機打亂選項順序<br><span class="hint">避免背答案字母</span></span></label>
    <label class="sw"><input type="checkbox" id="ib" ${cfg.incBad?"checked":""}><span>包含答案有疑義的題目（${Q.filter(q=>q.s==="X").length} 題）<br><span class="hint">Q9、Q13、Q122 的影片答案與官方文件不符，預設不出題</span></span></label>
  </section>
  <div class="actions"><div class="in">
    <button type="button" class="btn" id="wb" ${wrong.length?"":"disabled"}>錯題本（${wrong.length}）</button>
    <button type="button" class="btn primary" id="go" ${avail?"":"disabled"}>開始測驗</button>
  </div></div>`;
  app.querySelectorAll(".srcchip").forEach(b=>b.onclick=()=>{const k=b.dataset.s;cfg.srcs.has(k)?cfg.srcs.delete(k):cfg.srcs.add(k);setup()});
  app.querySelectorAll(".chip[data-d]").forEach(b=>b.onclick=()=>{const d=+b.dataset.d;cfg.doms.has(d)?cfg.doms.delete(d):cfg.doms.add(d);setup()});
  document.getElementById("all").onclick=()=>{cfg.doms=new Set([1,2,3,4,5,6]);setup()};
  document.getElementById("none").onclick=()=>{cfg.doms=new Set();setup()};
  app.querySelectorAll("#pre .btn").forEach(b=>b.onclick=()=>{cfg.count=b.dataset.n==="all"?avail:Math.min(+b.dataset.n,avail);setup()});
  document.getElementById("cnt").onchange=e=>{cfg.count=Math.max(1,Math.min(+e.target.value||1,avail||1));setup()};
  document.getElementById("so").onchange=e=>{cfg.shuffleOpts=e.target.checked};
  document.getElementById("ib").onchange=e=>{cfg.incBad=e.target.checked;setup()};
  document.getElementById("go").onclick=()=>start(shuffle(pool()).slice(0,cfg.count),"");
  document.getElementById("wb").onclick=()=>start(shuffle(Q.filter(q=>wrong.includes(q.n))),"錯題本");
}

function start(list,label){
  if(!list.length){setup();return}
  S={label,items:list.map(q=>({q,opts:cfg.shuffleOpts?shuffle(q.o):q.o})),i:0,res:[],sel:new Set(),done:false};
  show();
}

function show(){
  const it=S.items[S.i],q=it.q,multi=q.a.length>1,d=DOM[q.d];
  const pct=Math.round(S.i/S.items.length*100);
  app.innerHTML=`
  <div class="top"><span>${S.label?S.label+"・":""}第 ${S.i+1} / ${S.items.length} 題</span><button type="button" class="btn small" id="quit">結束</button></div>
  <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div>
  <section class="card">
    <div><span class="tag" style="--c:${d.c}">${d.n}</span><span class="hint">${SRC[sv(q)].n.split("：")[0]}・題庫 Q${q.n}</span></div>
    <div class="qtext">${esc(q.q)}</div>
    ${multi?`<div class="need">複選：請選 ${q.a.length} 項</div>`:""}
    <div class="opts" role="${multi?"group":"radiogroup"}">${it.opts.map((o,j)=>`<label class="opt" data-k="${o.k}"><input type="${multi?"checkbox":"radio"}" name="o" value="${o.k}"><span class="k">${String.fromCharCode(97+j)}.</span><span>${esc(o.t)}</span></label>`).join("")}</div>
    <div id="fb"></div>
  </section>
  <div class="actions"><div class="in"><button type="button" class="btn primary" id="act" disabled>確認答案</button></div></div>`;
  document.getElementById("quit").onclick=()=>{S.items=S.items.slice(0,S.i+(S.done?1:0));if(!S.items.length){setup();return}result()};
  const act=document.getElementById("act");
  app.querySelectorAll(".opt").forEach(l=>{
    const inp=l.querySelector("input");
    inp.onchange=()=>{
      if(S.done)return;
      if(multi){inp.checked?S.sel.add(l.dataset.k):S.sel.delete(l.dataset.k)}else{S.sel=new Set([l.dataset.k])}
      app.querySelectorAll(".opt").forEach(x=>x.classList.toggle("sel",S.sel.has(x.dataset.k)));
      act.disabled=S.sel.size===0;
    };
  });
  act.onclick=()=>S.done?next():submit();
}

function submit(){
  const it=S.items[S.i],q=it.q,right=new Set(q.a);
  const ok=S.sel.size===right.size&&[...S.sel].every(k=>right.has(k));
  S.done=true;S.res[S.i]={n:q.n,ok,sel:[...S.sel]};
  let w=loadWrong();
  if(ok){w=w.filter(n=>n!==q.n)}else if(!w.includes(q.n)){w.push(q.n)}
  saveWrong(w);
  app.querySelectorAll(".opt").forEach(l=>{
    const k=l.dataset.k,inp=l.querySelector("input");inp.disabled=true;l.classList.add("locked");
    if(right.has(k)&&S.sel.has(k))l.classList.add("right");
    else if(right.has(k))l.classList.add("missed");
    else if(S.sel.has(k))l.classList.add("wrong");
  });
  const corr=it.opts.map((o,j)=>right.has(o.k)?String.fromCharCode(97+j):"").filter(Boolean).join("、");
  const st=STL[q.s];
  document.getElementById("fb").innerHTML=
    `<div class="fb ${ok?"ok":"no"}"><b>${ok?"答對了":"答錯了"}</b>${ok?"":"正確答案："+corr}</div>`+
    (st[0]||q.m?`<div class="note ${st[1]}">${st[0]?`<b>${st[0]}</b>`:""}${q.m?`<div>${esc(q.m)}</div>`:""}</div>`:"");
  const act=document.getElementById("act");
  act.textContent=S.i+1<S.items.length?"下一題":"看結果";
  act.scrollIntoView({block:"nearest"});
  document.getElementById("fb").scrollIntoView({behavior:"smooth",block:"nearest"});
}

function next(){
  if(S.i+1>=S.items.length){result();return}
  S.i++;S.sel=new Set();S.done=false;show();window.scrollTo(0,0);
}

function result(){
  const res=S.res.filter(Boolean),total=res.length,good=res.filter(r=>r.ok).length;
  const pct=total?Math.round(good/total*100):0;
  const by={};res.forEach(r=>{const q=Q.find(x=>x.n===r.n);const o=by[q.d]||(by[q.d]={t:0,g:0});o.t++;if(r.ok)o.g++});
  const wrongNow=res.filter(r=>!r.ok);
  app.innerHTML=`
  <h1>測驗結果</h1>
  <section class="card"><div class="hint">${S.label||"本次測驗"}</div><div class="score">${good} / ${total}</div><div>答對率 ${pct}%${pct>=70?"，已達 70%（官方及格線為 700/1000 分，僅供參考）":""}</div></section>
  <section class="card"><h2>各主題表現</h2>${Object.entries(by).map(([k,v])=>`<div class="dom" style="--c:${DOM[k].c}"><span>${DOM[k].n}</span><b>${v.g}/${v.t}</b><div class="m"><i style="width:${Math.round(v.g/v.t*100)}%"></i></div></div>`).join("")||'<p class="hint">沒有作答紀錄。</p>'}</section>
  ${wrongNow.length?`<section class="card"><h2>答錯的題目（${wrongNow.length}）</h2><ul class="wl">${wrongNow.map(r=>{const q=Q.find(x=>x.n===r.n);return`<li>Q${q.n}　${esc(q.q)}<small>${DOM[q.d].n}</small></li>`}).join("")}</ul></section>`:""}
  <div class="actions"><div class="in">
    <button type="button" class="btn" id="again">重新設定</button>
    <button type="button" class="btn primary" id="redo" ${wrongNow.length?"":"disabled"}>錯題重練（${wrongNow.length}）</button>
  </div></div>`;
  document.getElementById("again").onclick=setup;
  document.getElementById("redo").onclick=()=>start(shuffle(wrongNow.map(r=>Q.find(q=>q.n===r.n))),"錯題重練");
  window.scrollTo(0,0);
}
document.getElementById("th").onclick=()=>{const r=document.documentElement;const t=r.dataset.theme==="light"?"dark":"light";r.dataset.theme=t;try{localStorage.setItem("gh300_theme",t)}catch(e){}};
if(Q.length)setup();

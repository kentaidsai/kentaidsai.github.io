<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub Foundations Quiz</title>
<style>
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --surface2: #21262d;
  --border: #30363d;
  --text: #e6edf3;
  --muted: #8b949e;
  --blue: #1f6feb;
  --blue-light: rgba(31,111,235,0.12);
  --green: #238636;
  --green-light: rgba(35,134,54,0.15);
  --red: #da3633;
  --red-light: rgba(218,54,51,0.15);
  --yellow: #d29922;
  --r: 8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
.container{max-width:780px;margin:0 auto;padding:24px 16px}

/* ── Screen visibility ── */
.screen{display:none}
.screen.active{display:block}

/* ── Home ── */
.hero{text-align:center;padding:56px 0 40px}
.hero h1{font-size:clamp(22px,5vw,38px);font-weight:700;margin-bottom:8px}
.hero h1 span{color:var(--blue)}
.hero p{color:var(--muted);font-size:15px}
.mode-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:36px}
.mode-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:28px 16px;text-align:center;cursor:pointer;transition:border-color .2s,transform .15s}
.mode-card:hover{border-color:var(--blue);transform:translateY(-3px)}
.mode-card:active{transform:translateY(0)}
.mode-card .num{font-size:38px;font-weight:700;color:var(--blue);line-height:1}
.mode-card .lbl{font-size:13px;color:var(--muted);margin-top:6px}
.mode-card .sub{font-size:11px;color:var(--muted);margin-top:3px;opacity:.7}

/* ── Quiz ── */
.quiz-top{display:flex;align-items:center;gap:14px;margin-bottom:24px}
.progress-wrap{flex:1;background:var(--surface2);border-radius:99px;height:5px;overflow:hidden}
.progress-fill{height:100%;background:var(--blue);border-radius:99px;transition:width .3s ease}
.quiz-counter{font-size:13px;color:var(--muted);white-space:nowrap}
.btn-quit{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:4px 8px;border-radius:4px;transition:color .15s}
.btn-quit:hover{color:var(--text)}

.qcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:24px}
.qmeta{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.qlabel{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px;border:1px solid;line-height:1.4}
.badge.multi{color:var(--yellow);border-color:var(--yellow)}
.badge.single{color:var(--blue);border-color:var(--blue)}
.qprompt{font-size:16px;font-weight:500;line-height:1.65}
.options{margin-top:18px;display:flex;flex-direction:column;gap:9px}

.opt{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);cursor:pointer;transition:border-color .15s,background .15s;user-select:none;-webkit-user-select:none}
.opt:hover{border-color:var(--blue)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt-letter{width:26px;height:26px;border-radius:50%;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;margin-top:1px;transition:background .15s,color .15s}
.opt-text{font-size:14px;line-height:1.6}
.opt.sel{border-color:var(--blue);background:var(--blue-light)}
.opt.sel .opt-letter{background:var(--blue);color:#fff}

/* After submit */
.opt.correct{border-color:var(--green);background:var(--green-light)}
.opt.correct .opt-letter{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-light)}
.opt.wrong .opt-letter{background:var(--red);color:#fff}
.opt.missed{border-color:var(--green);background:var(--green-light);opacity:.7}
.opt.missed .opt-letter{background:var(--green);color:#fff}

.feedback{margin-top:12px;padding:10px 14px;border-radius:6px;font-size:13px;line-height:1.5}
.feedback.ok{background:var(--green-light);border:1px solid var(--green);color:#7ee787}
.feedback.bad{background:var(--red-light);border:1px solid var(--red);color:#ff7b72}
.feedback.skip{background:var(--surface2);border:1px solid var(--border);color:var(--muted)}

.quiz-nav{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:16px;flex-wrap:wrap}
.btn{padding:9px 20px;border-radius:var(--r);border:1px solid;font-size:14px;font-weight:500;cursor:pointer;transition:opacity .15s,background .15s,transform .1s;line-height:1}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn:active:not(:disabled){transform:scale(.97)}
.btn-ghost{background:transparent;border-color:var(--border);color:var(--text)}
.btn-ghost:hover:not(:disabled){background:var(--surface2)}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-primary:hover:not(:disabled){opacity:.85}
.btn-success{background:var(--green);border-color:var(--green);color:#fff}
.btn-success:hover:not(:disabled){opacity:.85}
.btn-danger{background:var(--red);border-color:var(--red);color:#fff}
.btn-danger:hover:not(:disabled){opacity:.85}

.nav-left{display:flex;gap:8px}
.nav-right{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

/* Jump dots */
.dots-wrap{overflow-x:auto;padding:4px 0;margin:14px 0;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.dots-wrap::-webkit-scrollbar{display:none}
.dots{display:flex;gap:5px;width:max-content;margin:0 auto;padding:0 4px}
.dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;cursor:pointer;border:1.5px solid var(--border);background:var(--surface2);color:var(--muted);flex-shrink:0;transition:all .15s}
.dot.answered{background:rgba(31,111,235,.3);border-color:var(--blue);color:var(--text)}
.dot.current{border-color:var(--text);color:var(--text);font-weight:900}
.dot.correct-dot{background:rgba(35,134,54,.3);border-color:var(--green)}
.dot.wrong-dot{background:rgba(218,54,51,.3);border-color:var(--red)}
.dot.skip-dot{background:rgba(210,153,34,.2);border-color:var(--yellow)}

/* ── Results ── */
.results-hero{text-align:center;padding:40px 0 28px}
.score-ring{width:110px;height:110px;border-radius:50%;border:5px solid var(--blue);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 20px;background:var(--surface)}
.score-pct{font-size:28px;font-weight:700;line-height:1}
.score-lbl{font-size:11px;color:var(--muted);margin-top:2px}
.results-hero h2{font-size:22px;font-weight:700;margin-bottom:6px}
.results-hero p{color:var(--muted);font-size:14px}

.stats-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:28px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 20px;text-align:center;min-width:90px}
.stat .n{font-size:26px;font-weight:700}
.stat .n.g{color:var(--green)}
.stat .n.r{color:var(--red)}
.stat .n.y{color:var(--yellow)}
.stat .n.b{color:var(--blue)}
.stat-label{font-size:11px;color:var(--muted);margin-top:2px}

.review-hd{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.review-hd h3{font-size:16px;font-weight:600}
.filter-btns{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{padding:4px 12px;border-radius:99px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12px;cursor:pointer;transition:all .15s}
.fbtn.active{background:var(--surface2);color:var(--text);border-color:var(--text)}

.ritem{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:10px}
.ritem.ri-correct{border-color:var(--green)}
.ritem.ri-wrong{border-color:var(--red)}
.ritem.ri-skip{border-color:var(--yellow)}
.ri-header{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.ri-tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px}
.ri-tag.t-correct{background:var(--green-light);color:#7ee787}
.ri-tag.t-wrong{background:var(--red-light);color:#ff7b72}
.ri-tag.t-skip{background:rgba(210,153,34,.15);color:var(--yellow)}
.ri-qnum{font-size:12px;color:var(--muted)}
.ri-prompt{font-size:14px;line-height:1.6;margin-bottom:10px}
.ri-opts{display:flex;flex-direction:column;gap:5px}
.ri-opt{padding:7px 12px;border-radius:6px;font-size:13px;border:1px solid transparent;display:flex;gap:8px;align-items:flex-start;line-height:1.5}
.ri-opt.ro-correct{background:var(--green-light);border-color:var(--green)}
.ri-opt.ro-wrong{background:var(--red-light);border-color:var(--red)}
.ri-opt.ro-neutral{background:var(--surface2);border-color:var(--border)}
.ri-opt-ltr{font-weight:700;flex-shrink:0;font-size:12px;margin-top:1px}

.restart-row{text-align:center;margin:28px 0 40px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

@media(max-width:480px){
  .qcard{padding:18px}
  .opt{padding:10px 12px}
  .stats-row{gap:8px}
  .stat{padding:12px 14px;min-width:80px}
  .stat .n{font-size:22px}
}
</style>
</head>
<body>
<div class="container">

<!-- ══ HOME SCREEN ══ -->
<div id="s-home" class="screen active">
  <div class="hero">
    <h1>GitHub Foundations <span>Quiz</span></h1>
    <p>144 questions · Choose your practice mode</p>
  </div>
  <div class="mode-grid">
    <div class="mode-card" onclick="startQuiz(10)">
      <div class="num">10</div>
      <div class="lbl">Quick Drill</div>
      <div class="sub">~5 min</div>
    </div>
    <div class="mode-card" onclick="startQuiz(20)">
      <div class="num">20</div>
      <div class="lbl">Short Set</div>
      <div class="sub">~10 min</div>
    </div>
    <div class="mode-card" onclick="startQuiz(50)">
      <div class="num">50</div>
      <div class="lbl">Full Practice</div>
      <div class="sub">~25 min</div>
    </div>
    <div class="mode-card" onclick="startQuiz(0)">
      <div class="num" id="all-count">—</div>
      <div class="lbl">All Questions</div>
      <div class="sub">Exam simulation</div>
    </div>
  </div>
</div>

<!-- ══ QUIZ SCREEN ══ -->
<div id="s-quiz" class="screen">
  <div class="quiz-top">
    <button class="btn-quit" onclick="confirmQuit()">← Exit</button>
    <div class="progress-wrap"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="quiz-counter" id="quiz-counter"></div>
  </div>

  <div class="dots-wrap" id="dots-wrap">
    <div class="dots" id="dots"></div>
  </div>

  <div class="qcard" id="qcard">
    <div class="qmeta">
      <span class="qlabel" id="q-label"></span>
      <span class="badge" id="q-badge"></span>
    </div>
    <div class="qprompt" id="q-prompt"></div>
    <div class="options" id="q-options"></div>
    <div class="feedback" id="q-feedback" style="display:none"></div>
  </div>

  <div class="quiz-nav">
    <div class="nav-left">
      <button class="btn btn-ghost" id="btn-prev" onclick="navigate(-1)" disabled>← Prev</button>
      <button class="btn btn-ghost" id="btn-next" onclick="navigate(1)">Next →</button>
    </div>
    <div class="nav-right">
      <button class="btn btn-primary" id="btn-check" onclick="checkAnswer()">Check</button>
      <button class="btn btn-success" id="btn-submit" onclick="submitQuiz()" style="display:none">Submit Quiz</button>
    </div>
  </div>
</div>

<!-- ══ RESULTS SCREEN ══ -->
<div id="s-results" class="screen">
  <div class="results-hero">
    <div class="score-ring">
      <div class="score-pct" id="res-pct"></div>
      <div class="score-lbl">Score</div>
    </div>
    <h2 id="res-headline"></h2>
    <p id="res-sub"></p>
  </div>

  <div class="stats-row">
    <div class="stat"><div class="n g" id="r-correct"></div><div class="stat-label">Correct</div></div>
    <div class="stat"><div class="n r" id="r-wrong"></div><div class="stat-label">Wrong</div></div>
    <div class="stat"><div class="n y" id="r-skip"></div><div class="stat-label">Skipped</div></div>
    <div class="stat"><div class="n b" id="r-total"></div><div class="stat-label">Total</div></div>
  </div>

  <div class="review-hd">
    <h3>Review</h3>
    <div class="filter-btns">
      <button class="fbtn active" onclick="setFilter('all',this)">All</button>
      <button class="fbtn" onclick="setFilter('wrong',this)">Wrong</button>
      <button class="fbtn" onclick="setFilter('skip',this)">Skipped</button>
      <button class="fbtn" onclick="setFilter('correct',this)">Correct</button>
    </div>
  </div>
  <div id="review-list"></div>

  <div class="restart-row">
    <button class="btn btn-ghost" onclick="goHome()">← Back to Home</button>
    <button class="btn btn-primary" onclick="retryMissed()">Retry Missed</button>
  </div>
</div>

</div><!-- /container -->

<script>
// ════════════════════════════════════════════════════
//  RAW QUIZ DATA
// ════════════════════════════════════════════════════
const QUIZ_PART_1 = `Question 1
An engineer at example.com pauses a GitHub Codespace to save resources and does not commit recent edits to the repository. When they start that same codespace again later, will their uncommitted changes still be present? (Choose 1)

They will persist only if you pushed them to a remote branch before stopping
Yes, the uncommitted edits remain available when you reopen the same codespace
You must run a GitHub Actions backup workflow before stopping or the edits will be lost
No, uncommitted changes are discarded when you stop a codespace

Question 2
An engineer at scrumtuous.com is reviewing a project on GitHub and opens the Security tab for the repository. What information should they expect to find there? (Choose 1)

A catalog of all issues created for security concerns in that repository
Organization audit logs and SAML SSO configuration
A consolidated view that includes dependency vulnerability alerts along with code scanning findings and secret scanning detections
Contact details for the GitHub security team to report incidents

Question 3
You opened a pull request to the inventory service repository at example.com and the reviewer asked for several updates during code review. You want to continue the review while preserving the existing discussion and commit history. What should you do? (Choose 1)

Close the pull request and open a new one from the same branch
Apply the requested updates and push new commits to the existing pull request
Proceed without addressing the comments and try to merge as is
Abandon the pull request and create a separate change in Cloud Source Repositories

Question 4
When you are viewing an issue in a repository through the web interface, where do you initiate creating a new branch that will be linked to that issue? (Choose 1)

From the issue description area
In the Development section of the issue sidebar
From the repository settings page
From the pull request configuration page

Question 5
A team at scrumtuous.com is rolling out shared automation using GitHub Actions and wants one workflow to call a reusable workflow that resides in another location. In what situations does GitHub Actions allow this reuse to occur? (Choose 1)

If the called workflow is referenced through a repository that was renamed and GitHub redirects to the new name
When both workflows are in the same repository or the called workflow is in a public repository that your org allows or it is in a private repository with access granted
Only if the two workflows are stored in the same repository
Only if the called workflow is in a public repository

Question 6
Which capability is exclusive to GitHub Enterprise? (Choose 1)

GitHub Actions
GitHub Enterprise Support
GitHub Codespaces

Question 7
A product team at mcnz.com is drafting internal guidelines for adopting community driven tools and wants to pinpoint the single trait that truly sets open source software apart from proprietary products. Which statement describes that defining trait? (Choose 1)

Built and managed exclusively by one company
It must be distributed only through Google Cloud Marketplace
The source code is openly available to view modify and redistribute
The code remains closed and proprietary under vendor control

Question 8
Priya moderates GitHub Discussions for a community repository and sees that a topic in a question and answer category has a community reply that clearly resolves the issue. What action can Priya take to make that reply stand out for others who view the thread? (Choose 1)

Convert the discussion into an issue
Pin the reply at the top of the discussion
Mark the reply as the answer to the discussion thread
Edit the original discussion post to copy that reply into it

Question 9
Marble Peak Analytics at example.com uses GitHub Team today and plans to upgrade within 90 days to meet external audit requirements. Which capability would they gain with GitHub Enterprise that goes beyond what Team provides? (Choose 1)

Only GitHub Enterprise can integrate with Google Cloud Build
It is available only as a self hosted product
It includes expanded security, compliance, and deployment governance controls
It is the only plan that is free for organizations

Question 10
A product group at Rivertown Robotics manages backlogs in GitHub across several repositories and wants to keep work visible as it grows. What is the main advantage of applying labels to issues pull requests and discussions in this situation? (Choose 1)

To create executive dashboards that summarize sprint velocity without any manual input
To group and set priority on issues pull requests and discussions so the team can manage workflow effectively
To automatically measure server uptime and CPU usage with Cloud Monitoring
To count the exact number of lines of code each contributor adds to the repository

Question 11
Which Git command removes app/secrets.txt from the index while leaving the file in the working directory so you can then add it to .gitignore? (Choose 1)

git restore --staged app/secrets.txt
git rm --cached app/secrets.txt
git rm app/secrets.txt
git update-index --assume-unchanged app/secrets.txt

Question 12
Aisha is working in the acme-analytics repository and needs a quick view of all open issues and pull requests that are assigned to her. Which search filter should she use? (Choose 1)

is:open mentions:@me
assignee:@me is:open
is:open author:@me
is:issue is:open assignee:@me

Question 13
A new engineering lead at scrumtuous.com wants to establish a collaborative culture for internal software development and the team keeps referring to InnerSource during planning. What does InnerSource mean in this situation? (Choose 1)

A cataloging tool that inventories third party open source components in codebases
Applying open source practices within a single company
Cloud Source Repositories
A personal initiative to apply open source methods to side projects

Question 14
An engineering team at mcnz.com is rolling out GitHub to support their development process and collaboration. What is the primary reason teams use GitHub in this situation? (Choose 1)

Automating test and build pipelines with GitHub Actions
Hosting a static website through GitHub Pages
Collaborating on source code with version control and pull requests
Publishing packages and artifacts with GitHub Packages

Question 15
A product design startup named Riverpine Labs plans to adopt InnerSource to speed delivery and reduce duplicated effort among its engineering teams. In this context what does InnerSource refer to? (Choose 1)

Using third-party open source packages inside the company
A specific type of open source license
Collaborative development where internal teams share and contribute to proprietary code across the company
Removing all use of open source from internal builds

Question 16
BlueSky Robotics keeps its code on GitHub and wants to improve onboarding and collaboration by adding a top level README to each repository. Which outcomes are the primary advantages of including a thorough README? (Choose 3)

Identify maintainers and typical contributor roles
Cloud Storage
Clarify what the project does and why it matters to potential users
Point people to places to ask questions or get support

Question 17
Priya maintains a shared library on GitHub for a fintech startup named HelioPay and she wants to keep third party packages current and safe across the repository. In GitHub, how can she use the dependency graph to discover what her project depends on and manage risk from those packages? (Choose 1)

She can use the dependency graph to measure unit test coverage across dependencies
She can use the dependency graph to monitor how many stars her repositories receive
She can review the dependency graph to list direct and transitive packages with version and license details and known vulnerability severity
She can rely on the dependency graph to report runtime latency and throughput for each library

Question 18
An engineering group at example.com wants to automate updates to GitHub Projects through the GraphQL API using the gh CLI and they need to sign in with a token that permits full project changes. Which gh auth login command should they run to grant the correct scope? (Choose 1)

gh auth login --scopes "repo"
gh auth login --scopes "project"
gh auth login --scopes "read:user"
gh auth login --scopes "read:project"

Question 19
Your team at Riverbend Analytics wants to move from a simple Markdown issue template to a more guided experience that requires users to provide environment details and reproduction steps. In GitHub, what is the key difference between an issue template and an issue form that supports this need? (Choose 1)

Issue templates must be created through the web UI, and issue forms can only be added by a pull request to the default branch
Issue templates are restricted to private repositories, and issue forms only work in public repositories
An issue template is Markdown content that contributors can replace with their own details, and an issue form is a YAML based form with structured fields and required inputs
Issue templates require HTML to design fields, and issue forms require a GitHub App to render the components

Question 20
You manage identity for Northbridge Labs and you want employees who are already authenticated on the corporate intranet to open example.com without entering credentials again. Which technology should you deploy to provide this seamless access? (Choose 1)

SSH keys
SAML based single sign on
Identity-Aware Proxy
Two factor authentication

Question 21
BrightByte created a new repository and plans to use only the default labels that GitHub adds so that issues can be triaged consistently. Which label listed here is not part of the standard default labels that appear in a newly created repository? (Choose 1)

Help wanted
Community contribution
Duplicate
Bug

Question 22
Riley Chen at mcnz.com needs to add a 220 MiB dataset to a GitHub repository for a machine learning workflow. What should Riley do to make sure the file is accepted by GitHub and the upload completes successfully? (Choose 1)

Split the file into several smaller chunks and commit them separately
Use Git Large File Storage to track and push the dataset
Upload the file using the GitHub web interface
Store the file in Google Cloud Storage and link to it from the repository

Question 23
At mcnz.com the product team uses GitHub Projects to plan the next three months of work and they want a view where they can place items on a time span and drag them to change start and target dates and align them to iterations. What best describes the Roadmap layout? (Choose 1)

a board view with customizable columns for moving items through stages
a spreadsheet style grid that lists issues, pull requests, and draft items with flexible fields and filters
a timeline view that maps issues, pull requests, and draft items across an adjustable time window and lets you drag to set dates and iterations
a tree layout that nests items into parent and child levels to show hierarchy

Question 24
An engineering group at scrumtuous.com uses a GitHub repository to automate deployments to Google Cloud through GitHub Actions. They want workflows to start automatically when typical collaboration tasks happen in the repository. Which activities should be configured to trigger a workflow run? (Choose 3)

Pushing new commits to any branch
Changing the repository visibility from private to public in settings
Opening a new issue in the repository
Creating a pull request that targets the main branch

Question 25
Engineers at BlueRidge Analytics rely on GitHub Copilot for code completion across languages ranging from JavaScript to Elixir. Which factor most affects how comprehensive and accurate the suggestions are for a particular language? (Choose 1)

GitHub Copilot focuses only on a shortlist of popular languages and ignores uncommon languages
Languages that appear less often in public repositories tend to receive fewer and weaker suggestions
GitHub Copilot treats every language the same regardless of how much open source code exists for it
Suggestion quality is not tied to training data size or diversity for each language

Question 26
In GitHub Projects, which Insights chart displays both completed work and total scope for the past 30 days? (Choose 1)

Lead time chart
Burn up chart
Burndown chart

Question 27
Priya, a maintainer at Riverstone Apps, needs to locate open issues in a GitHub repository that have no labels, have no assignee, and still have zero comments so she can triage them first. Which search query should she use? (Choose 1)

is:open is:issue label:none assignee:none comments:none
is:open is:issue no:label no:assignee comments:0
is:open is:issue -label:* -assignee:* -comments:*
is:open is:issue no:label is:unassigned comments:0

Question 28
A maintainer at scrumtuous.com reviews a repository and opens the Network graph to inspect recent branch activity. How many of the most recently updated branches can GitHub display in that view? (Choose 1)

Up to 75 branches
Up to 150 branches
Up to 100 branches
Up to 50 branches

Question 29
A team at Northwind Games is comparing GitHub Desktop with GitHub.com to plan their daily workflows. Which capability is available only in GitHub Desktop and not on GitHub.com? (Choose 1)

Create new repositories

// ════════════════════════════════════════════════════

// ════════════════════════════════════════════════════

  111:["A"],112:["B"],113:["A","B","D"],114:["B"],115:["A","B","E"],116:["D","E"],

};

// ════════════════════════════════════════════════════
//  PARSE QUESTIONS
// ════════════════════════════════════════════════════
function parseChoiceCount(text) {
  const lower = text.toLowerCase();
  const words = { one:1, two:2, three:3, multiple:99 };
  const explicit = lower.match(/\(choose\s+(\d+|one|two|three|multiple)\)/);
  if (explicit) return Number(explicit[1]) || words[explicit[1]] || 1;
  const implied = lower.match(/\bwhich\s+(one|two|three)\b/);
  if (implied) return words[implied[1]] || 1;
  return 1;
}

function cleanPrompt(text) {
  return text.replace(/\s+\(Choose [^)]+\)/gi, "").trim();
}

function parseEntry(entry, order) {
  const lines = entry.split("\n").map(l => l.trimEnd());
  const heading = lines.shift().trim();
  const qnum = (heading.match(/^Question\s+(\d+)/i) || [null, order+1])[1];
  const contentLines = lines.join("\n").trim().split("\n").map(l=>l.trim()).filter(Boolean);
  const optStart = contentLines.findIndex(l => /^[A-Z]\.\s+/.test(l));

  const prompt = optStart !== -1
    ? contentLines.slice(0, optStart).join(" ").trim()
    : (contentLines[0] || "");

  const options = optStart !== -1
    ? contentLines.slice(optStart).reduce((list, line) => {
        if (/^[A-Z]\.\s+/.test(line)) list.push(line.replace(/^[A-Z]\.\s+/,"").trim());
        else if (list.length) list[list.length-1] += " " + line;
        return list;
      }, [])
    : contentLines.slice(1);

  return {
    id: `q-${order+1}`,
    qnum: parseInt(qnum, 10),
    label: `Q${qnum}`,
    ordinal: order+1,
    prompt: cleanPrompt(prompt),
    choose: parseChoiceCount(prompt),
    options
  };
}

// Parse & deduplicate
const rawAll = [QUIZ_PART_1, QUIZ_PART_2, QUIZ_PART_3].join("\n\n");
const allParsed = rawAll.split(/(?=Question\s+\d+)/g).map(e=>e.trim()).filter(Boolean).map(parseEntry);

const seenQnums = new Set();
const ALL_QUESTIONS = allParsed.filter(q => {
  if (seenQnums.has(q.qnum)) return false;
  seenQnums.add(q.qnum);
  return true;
});

// Build answer key: qnum → array of 0-based indexes
function lettersToIdx(letters) { return letters.map(l => l.charCodeAt(0) - 65); }
const ANSWER_KEY = {};
ALL_QUESTIONS.forEach(q => {
  const ans = RAW_ANSWERS[q.qnum];
  if (ans) ANSWER_KEY[q.id] = lettersToIdx(ans);
});

// ════════════════════════════════════════════════════
//  QUIZ STATE
// ════════════════════════════════════════════════════
let questions = [];
let answers = {};   // id → Set of selected indexes
let checked = {};   // id → true if user checked this question
let curIdx = 0;
let quizDone = false;
let missedIds = [];

document.getElementById('all-count').textContent = ALL_QUESTIONS.length;

// ════════════════════════════════════════════════════
//  START QUIZ
// ════════════════════════════════════════════════════
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function startQuiz(count, pool) {
  const src = pool || ALL_QUESTIONS;
  questions = count === 0 ? [...src] : shuffle(src).slice(0, Math.min(count, src.length));
  answers = {};
  checked = {};
  curIdx = 0;
  quizDone = false;
  questions.forEach(q => { answers[q.id] = new Set(); });
  show('s-quiz');
  renderQuestion(0);
}

function confirmQuit() {
  if (confirm('Exit quiz? Your progress will be lost.')) goHome();
}

function goHome() {
  show('s-home');
  quizDone = false;
}

// ════════════════════════════════════════════════════
//  RENDER QUESTION
// ════════════════════════════════════════════════════
function renderQuestion(idx) {
  curIdx = idx;
  const q = questions[idx];
  const total = questions.length;
  const isMulti = q.choose > 1;

  // Progress
  const pct = ((idx+1)/total*100).toFixed(1);
  document.getElementById('progress-fill').style.width = pct+'%';
  document.getElementById('quiz-counter').textContent = `${idx+1} / ${total}`;

  // Card
  document.getElementById('q-label').textContent = q.label;
  const badge = document.getElementById('q-badge');
  if (isMulti) {
    badge.textContent = `Select ${q.choose === 99 ? 'all that apply' : q.choose}`;
    badge.className = 'badge multi';
  } else {
    badge.textContent = 'Single choice';
    badge.className = 'badge single';
  }
  document.getElementById('q-prompt').textContent = q.prompt;

  // Options
  const container = document.getElementById('q-options');
  container.innerHTML = '';
  const sel = answers[q.id];
  const isChecked = checked[q.id] || quizDone;
  const correctIdxs = ANSWER_KEY[q.id] || [];

  q.options.forEach((opt, i) => {
    const letter = String.fromCharCode(65+i);
    const isSelected = sel.has(i);
    const isCorrect = correctIdxs.includes(i);

    let cls = 'opt';
    if (isChecked) {
      if (isCorrect && isSelected) cls += ' correct';
      else if (!isCorrect && isSelected) cls += ' wrong';
      else if (isCorrect && !isSelected) cls += ' missed';
    } else if (isSelected) {
      cls += ' sel';
    }

    const label = document.createElement('label');
    label.className = cls;
    label.setAttribute('data-idx', i);
    label.innerHTML = `
      <input type="${isMulti?'checkbox':'radio'}" name="q${q.id}" value="${i}" ${isSelected?'checked':''}>
      <span class="opt-letter">${letter}</span>
      <span class="opt-text">${opt}</span>`;

    if (!isChecked) {
      label.addEventListener('click', (e) => {
        e.preventDefault();
        toggleOption(q, i, isMulti);
      });
    }
    container.appendChild(label);
  });

  // Feedback
  const fb = document.getElementById('q-feedback');
  if (isChecked) {
    const correct = isAnswerCorrect(q.id);
    const unanswered = answers[q.id].size === 0;
    fb.style.display = 'block';
    if (unanswered) {
      fb.className = 'feedback skip';
      fb.textContent = 'Skipped — correct answer highlighted above.';
    } else if (correct) {
      fb.className = 'feedback ok';
      fb.textContent = '✓ Correct!';
    } else {
      const letters = correctIdxs.map(i=>String.fromCharCode(65+i)).join(', ');
      fb.className = 'feedback bad';
      fb.textContent = `✗ Incorrect. Correct: ${letters}`;
    }
  } else {
    fb.style.display = 'none';
  }

  // Nav buttons
  document.getElementById('btn-prev').disabled = idx === 0;
  document.getElementById('btn-next').disabled = idx === total-1;
  document.getElementById('btn-check').style.display = isChecked ? 'none' : '';
  document.getElementById('btn-submit').style.display = idx === total-1 ? '' : 'none';
  if (document.getElementById('btn-submit').style.display !== 'none') {
    document.getElementById('btn-check').style.display = isChecked ? 'none' : 'none'; // hide check on last
  }

  // Dots
  renderDots();
}

function renderDots() {
  const dots = document.getElementById('dots');
  dots.innerHTML = '';
  questions.forEach((q, i) => {
    const d = document.createElement('div');
    const sel = answers[q.id];
    const isChecked = checked[q.id] || quizDone;
    let cls = 'dot';
    if (i === curIdx) cls += ' current';
    if (isChecked) {
      if (sel.size === 0) cls += ' skip-dot';
      else if (isAnswerCorrect(q.id)) cls += ' correct-dot';
      else cls += ' wrong-dot';
    } else if (sel.size > 0) {
      cls += ' answered';
    }
    d.className = cls;
    d.textContent = i+1;
    d.onclick = () => renderQuestion(i);
    dots.appendChild(d);
  });

  // Scroll current dot into view
  setTimeout(() => {
    const cur = dots.querySelector('.current');
    if (cur) cur.scrollIntoView({ behavior:'smooth', block:'nearest', inline:'center' });
  }, 50);
}

function toggleOption(q, idx, isMulti) {
  const sel = answers[q.id];
  if (isMulti) {
    if (sel.has(idx)) sel.delete(idx);
    else sel.add(idx);
  } else {
    sel.clear();
    sel.add(idx);
  }
  renderQuestion(curIdx);
}

function checkAnswer() {
  const q = questions[curIdx];
  checked[q.id] = true;
  renderQuestion(curIdx);
}

function navigate(dir) {
  const next = curIdx + dir;
  if (next >= 0 && next < questions.length) renderQuestion(next);
}

function isAnswerCorrect(id) {
  const sel = answers[id];
  const correct = ANSWER_KEY[id] || [];
  if (sel.size !== correct.length) return false;
  return correct.every(i => sel.has(i));
}

// ════════════════════════════════════════════════════
//  SUBMIT QUIZ
// ════════════════════════════════════════════════════
function submitQuiz() {
  if (!confirm('Submit quiz? You can review answers after submitting.')) return;
  quizDone = true;
  // mark all as checked
  questions.forEach(q => { checked[q.id] = true; });
  renderQuestion(curIdx);
  setTimeout(() => showResults(), 300);
}

function showResults() {
  let correct = 0, wrong = 0, skip = 0;
  missedIds = [];
  questions.forEach(q => {
    const sel = answers[q.id];
    if (sel.size === 0) { skip++; missedIds.push(q.id); }
    else if (isAnswerCorrect(q.id)) correct++;
    else { wrong++; missedIds.push(q.id); }
  });

  const total = questions.length;
  const pct = Math.round(correct/total*100);
  document.getElementById('res-pct').textContent = pct+'%';
  document.getElementById('res-headline').textContent = pct >= 80 ? '🎉 Great work!' : pct >= 60 ? '📚 Keep studying!' : '💪 More practice needed';
  document.getElementById('res-sub').textContent = `You answered ${correct} of ${total} correctly`;
  document.getElementById('r-correct').textContent = correct;
  document.getElementById('r-wrong').textContent = wrong;
  document.getElementById('r-skip').textContent = skip;
  document.getElementById('r-total').textContent = total;

  buildReview('all');
  show('s-results');
}

// ════════════════════════════════════════════════════
//  REVIEW
// ════════════════════════════════════════════════════
let activeFilter = 'all';

function setFilter(f, btn) {
  activeFilter = f;
  document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  buildReview(f);
}

function buildReview(filter) {
  const list = document.getElementById('review-list');
  list.innerHTML = '';
  questions.forEach(q => {
    const sel = answers[q.id];
    const correct = ANSWER_KEY[q.id] || [];
    const isCorrect = isAnswerCorrect(q.id);
    const isSkip = sel.size === 0;
    const status = isSkip ? 'skip' : isCorrect ? 'correct' : 'wrong';
    if (filter !== 'all' && filter !== status) return;

    const item = document.createElement('div');
    item.className = `ritem ri-${status}`;

    const tagText = isSkip ? 'Skipped' : isCorrect ? 'Correct' : 'Wrong';
    const tagCls = `ri-tag t-${status}`;

    let optsHtml = '';
    q.options.forEach((opt, i) => {
      const letter = String.fromCharCode(65+i);
      const isCor = correct.includes(i);
      const isSel = sel.has(i);
      let cls = 'ri-opt ro-neutral';
      if (isCor && isSel) cls = 'ri-opt ro-correct';
      else if (!isCor && isSel) cls = 'ri-opt ro-wrong';
      else if (isCor) cls = 'ri-opt ro-correct';
      optsHtml += `<div class="${cls}"><span class="ri-opt-ltr">${letter}.</span><span>${opt}</span></div>`;
    });

    item.innerHTML = `
      <div class="ri-header">
        <span class="${tagCls}">${tagText}</span>
        <span class="ri-qnum">${q.label}</span>
      </div>
      <div class="ri-prompt">${q.prompt}</div>
      <div class="ri-opts">${optsHtml}</div>`;
    list.appendChild(item);
  });

  if (list.innerHTML === '') {
    list.innerHTML = '<p style="color:var(--muted);text-align:center;padding:24px 0">Nothing to show</p>';
  }
}

function retryMissed() {
  const pool = questions.filter(q => missedIds.includes(q.id));
  if (!pool.length) { alert('No missed questions!'); return; }
  startQuiz(0, pool);
}

// ════════════════════════════════════════════════════
//  SCREEN SWITCH
// ════════════════════════════════════════════════════
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

// ════════════════════════════════════════════════════
//  KEYBOARD SHORTCUTS
// ════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  const quizActive = document.getElementById('s-quiz').classList.contains('active');
  if (!quizActive) return;
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); navigate(-1); }
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); navigate(1); }
  if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    if (!checked[questions[curIdx]?.id]) checkAnswer();
    else navigate(1);
  }

  // A-G to select option
  const match = e.key.toUpperCase().match(/^[A-G]$/);
  if (match && !quizDone) {
    const q = questions[curIdx];
    if (!checked[q.id]) {
      const idx = e.key.toUpperCase().charCodeAt(0) - 65;
      if (idx < q.options.length) toggleOption(q, idx, q.choose > 1);
    }
  }
});
</script>

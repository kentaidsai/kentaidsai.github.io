<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>n8n 進階班 · 課程捷運路線圖</title>
<style>
  :root{--brand:#EA4B71;--purple:#7D5FFF;--blue:#38bdf8;--green:#34d399;--grey:#94a3b8;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",-apple-system,system-ui,sans-serif;background:#020617;color:#f1f5f9;padding:26px 20px 40px}
  .head{max-width:1200px;margin:0 auto 10px}
  .kick{color:var(--brand);font-weight:800;letter-spacing:3px;font-size:14px}
  h1{font-size:30px;margin:6px 0 4px}
  .sub{color:#94a3b8;font-size:15px}
  .legend{display:flex;flex-wrap:wrap;gap:16px;margin:16px 0 6px;max-width:1200px}
  .lg{display:flex;align-items:center;gap:8px;font-size:14px;color:#e2e8f0}
  .lg i{width:26px;height:8px;border-radius:4px;display:inline-block}
  .wrap{max-width:1200px;margin:0 auto;background:linear-gradient(160deg,#0f172a,#0b1220);border:1px solid #1e293b;border-radius:20px;padding:12px}
  svg{width:100%;height:auto;display:block}
  .stName{font:600 15px "PingFang TC","Microsoft JhengHei",sans-serif;fill:#f1f5f9}
  .stEn{font:500 11px ui-sans-serif,sans-serif;fill:#94a3b8}
  .stCode{font:800 13px ui-sans-serif,sans-serif}
  .pill{font:800 14px "PingFang TC",sans-serif;fill:#fff}
  .foot{max-width:1200px;margin:12px auto 0;color:#64748b;font-size:13px;text-align:center}
</style>
</head>
<body>
<div class="head">
  <div class="kick">n8n 進階班 · 打造專業級自動化方案</div>
  <h1>課程捷運路線圖</h1>
  <div class="sub">四條路線 · 16 站 · 每條線是一個模組（章節），每一站是一個 Lab，模組交界為轉乘站</div>
</div>
<div class="legend" id="legend"></div>
<div class="wrap"><div id="svgbox"></div></div>
<div class="foot">沿著路線從「開課前置」搭到「結業」——先讓它會動 → 再拆參數 → 再包成別人能用的介面。</div>

<script>
const MOD = {
  0:{c:'#94a3b8',name:'前置 · Pre-course'},
  1:{c:'#EA4B71',name:'模組一 · 基礎整合'},
  2:{c:'#38bdf8',name:'模組二 · 資料爬取'},
  3:{c:'#7D5FFF',name:'模組三 · 進階應用'},
  4:{c:'#34d399',name:'結業 · Graduation'},
};
const S = [
 {code:'0', zh:'開課前置', en:'Setup', mod:0, kind:'term'},
 {code:'01', zh:'短網址', en:'URL Shortener', mod:1},
 {code:'02', zh:'Gmail 寄信', en:'Gmail Send', mod:1},
 {code:'03', zh:'QR Code', en:'QR Code', mod:1},
 {code:'04', zh:'庫存補貨', en:'Restock', mod:1},
 {code:'05', zh:'Telegram', en:'Telegram Bot', mod:1},
 {code:'06', zh:'語音轉文字', en:'Voice → Text', mod:1, kind:'ix'},
 {code:'07', zh:'文字爬取', en:'Crawl Text', mod:2, kind:'ix'},
 {code:'08', zh:'JSON 分頁', en:'Crawl JSON', mod:2},
 {code:'09', zh:'HTML 解析', en:'CSS Selector', mod:2},
 {code:'10', zh:'動態頁面', en:'Headless', mod:2},
 {code:'11', zh:'RSS 摘要', en:'Crawl RSS', mod:2},
 {code:'12', zh:'公休日案例', en:'Off-days', mod:2, kind:'ix'},
 {code:'13', zh:'全頁截圖', en:'Screenshot', mod:3, kind:'ix'},
 {code:'14', zh:'錯誤處理', en:'Error Handling', mod:3},
 {code:'15', zh:'Airtable CRM', en:'CRM', mod:3},
 {code:'16', zh:'工作流備份', en:'Backup', mod:3},
 {code:'★', zh:'結業', en:'Graduation', mod:4, kind:'term'},
];
const W=1200, L=110, R=1090, USE=R-L;
const yR=[160,360,560];
// assign coordinates
S.forEach((s,i)=>{
  if(i<=6){ s.x = L + i*(USE/6); s.y=yR[0]; s.side='up'; }
  else if(i<=12){ const k=i-7; s.x = R - k*(USE/5); s.y=yR[1]; s.side='down'; }
  else { const j=i-13; s.x = L + j*(USE/4); s.y=yR[2]; s.side='down'; }
});
function edgeColor(a,b){ if(a.mod===0) return MOD[0].c; if(b.mod===4) return MOD[4].c; return MOD[b.mod].c; }
const H=700;
let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
// glow filter
svg += `<defs><filter id="g" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/></filter></defs>`;
// line segments
for(let i=0;i<S.length-1;i++){
  const a=S[i], b=S[i+1], col=edgeColor(a,b);
  svg += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${col}" stroke-width="13" stroke-linecap="round"/>`;
}
// module tags along the line
function tag(x,y,text,col){
  const w = text.length*15+22;
  return `<g><rect x="${x-w/2}" y="${y-16}" rx="14" width="${w}" height="32" fill="${col}"/><text x="${x}" y="${y+6}" text-anchor="middle" class="pill">${text}</text></g>`;
}
svg += tag(S[0].x+70, S[0].y-104, '前置', MOD[0].c);
svg += tag((S[1].x+S[6].x)/2, S[0].y-104, '模組一 · 基礎整合', MOD[1].c);
svg += tag((S[7].x+S[12].x)/2, S[7].y-72, '模組二 · 資料爬取', MOD[2].c);
svg += tag((S[13].x+S[16].x)/2, S[16].y+96, '模組三 · 進階應用', MOD[3].c);
svg += tag(S[17].x, S[17].y+96, '結業', MOD[4].c);
// stations
S.forEach(s=>{
  const col=MOD[s.mod].c;
  const r = s.kind==='term'?21 : s.kind==='ix'?18 : 15;
  svg += `<circle cx="${s.x}" cy="${s.y}" r="${r+4}" fill="#0b1220"/>`;
  svg += `<circle cx="${s.x}" cy="${s.y}" r="${r}" fill="#0f172a" stroke="${col}" stroke-width="5"/>`;
  if(s.kind==='ix') svg += `<circle cx="${s.x}" cy="${s.y}" r="${r-7}" fill="none" stroke="${col}" stroke-width="2.5"/>`;
  svg += `<text x="${s.x}" y="${s.y+5}" text-anchor="middle" class="stCode" fill="${col}">${s.code}</text>`;
  // labels
  const up = s.side==='up';
  const ny = up ? s.y - 40 : s.y + 44;
  const ey = up ? s.y - 58 : s.y + 61;
  svg += `<text x="${s.x}" y="${ny}" text-anchor="middle" class="stName">${s.zh}</text>`;
  svg += `<text x="${s.x}" y="${ey}" text-anchor="middle" class="stEn">${s.en}</text>`;
});
svg += `</svg>`;
document.getElementById('svgbox').innerHTML = svg;
// legend
document.getElementById('legend').innerHTML = Object.values(MOD).map(m=>`<div class="lg"><i style="background:${m.c}"></i>${m.name}</div>`).join('');
</script>
</body>
</html>

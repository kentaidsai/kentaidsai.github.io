<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIB-C01 題庫測驗</title>
<style>
:root{--bg:#f2f3f3;--card:#fff;--ink:#16191f;--mute:#5f6b7a;--line:#d5dbdb;--brand:#232f3e;--brand2:#0972d3;--acc:#ff9900;--acc2:#ec7211;--ontop:#16191f;--ok:#157f3c;--okbg:#e7f6ec;--bad:#b42318;--badbg:#fdecea;--warn:#b45309;--warnbg:#fff4e0}
@media(prefers-color-scheme:dark){:root{--bg:#0f1b2a;--card:#192534;--ink:#eaeded;--mute:#9ba7b6;--line:#2f3e50;--brand:#ff9900;--brand2:#539fe5;--ok:#4ade80;--okbg:#10301d;--bad:#f87171;--badbg:#3a1614;--warn:#fbbf24;--warnbg:#3a2a0c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:16px 14px 80px}
h1{font-size:1.4rem;margin:8px 0 2px;color:var(--brand)}h2{font-size:1.05rem;margin:0 0 10px}
.sub{color:var(--mute);font-size:.9rem;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:1.4rem;color:var(--brand)}.stat span{color:var(--mute);font-size:.8rem}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.chip{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 10px;cursor:pointer;background:var(--card);user-select:none}
.chip input{margin-top:5px;accent-color:var(--acc2)}
.chip.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--card))}
.chip small{display:block;color:var(--mute)}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;cursor:pointer}
button:hover{border-color:var(--acc2)}
button.primary{background:var(--acc);color:var(--ontop);border-color:var(--acc2);font-weight:600}button.primary:hover{background:var(--acc2);border-color:var(--acc2)}

button.danger{color:var(--bad)}button:disabled{opacity:.45;cursor:not-allowed}
.link{border:none;background:none;color:var(--brand2);padding:2px 6px}
input[type=number]{font:inherit;width:84px;padding:7px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
input[type=range]{flex:1;min-width:160px;accent-color:var(--brand)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:none;border-radius:0}.seg button.on{background:var(--acc);color:var(--ontop);font-weight:600}

.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 12px}.bar i{display:block;height:100%;background:var(--acc);transition:width .2s}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tag{font-size:.75rem;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--brand2) 12%,var(--card));color:var(--brand2)}
.tag.m{background:var(--warnbg);color:var(--warn)}
.stem{font-size:1.05rem;margin:6px 0 14px;white-space:pre-wrap}
.opt{display:flex;gap:10px;width:100%;text-align:left;margin-bottom:8px;padding:11px 12px;align-items:flex-start}
.opt .k{flex:0 0 26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:600}
.opt.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--card))}.opt.sel .k{background:var(--acc);color:var(--ontop);border-color:var(--acc)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.no{border-color:var(--bad);background:var(--badbg)}.opt.no .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.miss{border-style:dashed;border-color:var(--ok)}
.fb{border-radius:10px;padding:10px 12px;margin-top:6px;font-size:.95rem}
.fb.ok{background:var(--okbg);color:var(--ok)}.fb.no{background:var(--badbg);color:var(--bad)}
.expl{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:.93rem;white-space:pre-wrap}
.nav{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:14px 0 10px;display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.score{font-size:2.6rem;font-weight:700;color:var(--brand);line-height:1.1}
table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
.pill{display:inline-block;min-width:22px;text-align:center;border-radius:6px;padding:0 6px;font-size:.8rem}.pill.ok{background:var(--okbg);color:var(--ok)}.pill.no{background:var(--badbg);color:var(--bad)}
details{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--card)}
summary{padding:10px 12px;cursor:pointer;list-style:none;display:flex;gap:8px}summary::-webkit-details-marker{display:none}
details .in{padding:0 12px 12px}
.hide{display:none}
.q{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.dot{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;font-size:.8rem;cursor:pointer;background:var(--card)}
.dot.cur{border-color:var(--acc);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 35%,transparent)}.dot.done{background:color-mix(in srgb,var(--acc) 16%,var(--card))}
.dot.ok{background:var(--okbg);color:var(--ok)}.dot.no{background:var(--badbg);color:var(--bad)}
@media(max-width:520px){.wrap{padding:10px 10px 80px}.card{padding:12px}.chips{grid-template-columns:1fr}.nav button{flex:1}}

.top{background:#232f3e;color:#fff;border-bottom:3px solid #ff9900;padding:10px 16px;font-weight:600;display:flex;align-items:center;gap:10px}.top b{background:#ff9900;color:#16191f;border-radius:4px;padding:1px 8px;font-weight:800;letter-spacing:.5px}.top span{font-weight:400;opacity:.8;font-size:.85rem}
</style></head><body><div class="top"><b>AWS</b>AIB-C01 題庫測驗<span>AI Business Strategist</span></div>
<div class="wrap" id="app"></div>
<script src="aws_aibs.js"></script>
<script>
const TOPICS=[...new Map(DATA.map(q=>[q.dm,q.domain])).entries()].sort((a,b)=>a[0]-b[0]);
const SUBS=[...new Set(DATA.map(q=>q.sub))];
const SRC={CN:'cloudninja.pro',SP:'Shapingpixel',GD:'Get It Done',CC:'Core Concept',PE:'Practice Exam 2026'};
const $=(t,a={},...c)=>{const e=document.createElement(t);for(const[k,v]of Object.entries(a)){if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(v!==false&&v!=null)e.setAttribute(k,v===true?'':v)}for(const x of c.flat())if(x!=null)e.append(x.nodeType?x:document.createTextNode(x));return e};
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let wrong=new Set(LS.get('aib_wrong',[])),stats=LS.get('aib_stats',{}),last=LS.get('aib_last',null);
let cfg=Object.assign({topics:TOPICS.map(t=>t[0]),subs:SUBS,sources:Object.keys(SRC),count:20,shuffle:true,mode:'instant'},LS.get('aib_cfg2',{}));
let S=null;const byId=Object.fromEntries(DATA.map(q=>[q.id,q]));
const saveAll=()=>{LS.set('aib_wrong',[...wrong]);LS.set('aib_stats',stats)};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pool=()=>DATA.filter(q=>cfg.topics.includes(q.dm)&&cfg.subs.includes(q.sub)&&cfg.sources.includes(q.code));
const tagD=q=>'Domain '+q.dm+'・'+q.sub;
const app=document.getElementById('app');
function show(n){app.replaceChildren(...[n].flat(Infinity).filter(Boolean));window.scrollTo(0,0)}

function home(){
 const p=pool();cfg.count=Math.max(1,Math.min(cfg.count,p.length||1));
 const acc=(()=>{let c=0,w=0;for(const v of Object.values(stats)){c+=v.c;w+=v.w}return c+w?Math.round(100*c/(c+w)):'–'})();
 const poolLine=$('div',{class:'sub'}),cnt=$('input',{type:'number',min:1,max:Math.max(1,p.length),value:cfg.count}),rg=$('input',{type:'range',min:1,max:Math.max(1,p.length),value:cfg.count});
 const upd=()=>{poolLine.textContent=`目前條件共 ${p.length} 題可抽；本次抽 ${cfg.count} 題`;go.disabled=!p.length};
 const setCount=v=>{cfg.count=Math.max(1,Math.min(+v||1,p.length||1));cnt.value=rg.value=cfg.count;LS.set('aib_cfg2',cfg);upd()};
 cnt.oninput=()=>setCount(cnt.value);rg.oninput=()=>setCount(rg.value);
 const go=$('button',{class:'primary',onclick:()=>start(p,cfg.count)},'開始測驗');
 const wb=$('button',{onclick:()=>startWrong([...wrong].map(i=>byId[i]).filter(Boolean))},`練習錯題本（${wrong.size}）`);wb.disabled=!wrong.size;
 const topicBox=$('div',{class:'chips'},TOPICS.map(([dm,name])=>{
  const n=DATA.filter(q=>q.dm===dm&&cfg.subs.includes(q.sub)&&cfg.sources.includes(q.code)).length;
  const hs=DATA.filter(q=>q.dm===dm).map(q=>stats[q.id]).filter(Boolean);const c=hs.reduce((a,b)=>a+b.c,0),w=hs.reduce((a,b)=>a+b.w,0);
  const on=cfg.topics.includes(dm);
  const cb=$('input',{type:'checkbox',checked:on});
  const el=$('label',{class:'chip'+(on?' on':'')},cb,$('div',{},name,$('small',{},`${n} 題`+(c+w?`・正確率 ${Math.round(100*c/(c+w))}%`:''))));
  cb.onchange=()=>{cfg.topics=cb.checked?[...cfg.topics,dm]:cfg.topics.filter(x=>x!==dm);LS.set('aib_cfg2',cfg);home()};return el}));
 const subBox=$('div',{class:'chips'},SUBS.map(sn=>{
  const n=DATA.filter(q=>q.sub===sn&&cfg.topics.includes(q.dm)&&cfg.sources.includes(q.code)).length;
  const on=cfg.subs.includes(sn);const cb=$('input',{type:'checkbox',checked:on});
  const el=$('label',{class:'chip'+(on?' on':'')},cb,$('div',{},sn,$('small',{},`${n} 題`)));
  cb.onchange=()=>{cfg.subs=cb.checked?[...cfg.subs,sn]:cfg.subs.filter(x=>x!==sn);LS.set('aib_cfg2',cfg);home()};return el}));
 const srcBox=$('div',{class:'chips'},Object.entries(SRC).map(([k,name])=>{
  const n=DATA.filter(q=>q.code===k&&cfg.topics.includes(q.dm)&&cfg.subs.includes(q.sub)).length;const on=cfg.sources.includes(k);
  const cb=$('input',{type:'checkbox',checked:on});
  const el=$('label',{class:'chip'+(on?' on':'')},cb,$('div',{},name,$('small',{},`${n} 題`)));
  cb.onchange=()=>{cfg.sources=cb.checked?[...cfg.sources,k]:cfg.sources.filter(x=>x!==k);LS.set('aib_cfg2',cfg);home()};return el}));
 const seg=(opts,key)=>$('div',{class:'seg'},opts.map(([v,l])=>$('button',{class:cfg[key]===v?'on':'',onclick:()=>{cfg[key]=v;LS.set('aib_cfg2',cfg);home()}},l)));
 upd();
 show([$('h1',{},'AIB-C01 題庫測驗'),$('div',{class:'sub'},'AWS Certified AI Business Strategist・403 題・依考試 Domain 篩選、隨機抽題、錯題重練'),
 $('div',{class:'stats'},$('div',{class:'stat'},$('b',{},DATA.length),$('span',{},'題庫總題數')),$('div',{class:'stat'},$('b',{},wrong.size),$('span',{},'錯題本')),$('div',{class:'stat'},$('b',{},acc+(acc==='–'?'':'%')),$('span',{},'累計正確率')),$('div',{class:'stat'},$('b',{},last?last.pct+'%':'–'),$('span',{},'上次成績'))),
 $('div',{class:'card'},$('div',{class:'row',style:'justify-content:space-between'},$('h2',{},'1. 考試 Domain'),$('div',{},$('button',{class:'link',onclick:()=>{cfg.topics=TOPICS.map(t=>t[0]);home()}},'全選'),$('button',{class:'link',onclick:()=>{cfg.topics=[];home()}},'全不選'))),topicBox),
 $('details',{class:'card'},$('summary',{style:'padding:0'},$('h2',{style:'margin:0'},'進階：依子主題再細分（選填）')),$('div',{class:'row',style:'margin:8px 0'},$('button',{class:'link',onclick:()=>{cfg.subs=SUBS;home()}},'全選'),$('button',{class:'link',onclick:()=>{cfg.subs=[];home()}},'全不選')),subBox),
 $('div',{class:'card'},$('h2',{},'2. 題庫來源'),srcBox),
 $('div',{class:'card'},$('h2',{},'3. 隨機題數'),$('div',{class:'row'},rg,cnt,[10,20,40].map(n=>$('button',{onclick:()=>setCount(n)},n)),$('button',{onclick:()=>setCount(p.length)},'全部')),poolLine),
 $('div',{class:'card'},$('h2',{},'4. 作答設定'),$('div',{class:'row'},$('span',{},'模式'),seg([['instant','即時解析'],['exam','考試模式（交卷後檢討）']],'mode')),$('div',{class:'row',style:'margin-top:10px'},$('span',{},'選項順序'),seg([[true,'隨機打亂'],[false,'維持原序']],'shuffle'))),
 $('div',{class:'row'},go,wb,$('button',{class:'danger',onclick:()=>{if(confirm('確定清除錯題本與所有作答紀錄？')){wrong.clear();stats={};last=null;saveAll();LS.set('aib_last',null);home()}}},'清除紀錄'))]);
}

function mk(qs,label){
 return {label,qs:qs.map(q=>{let keys=Object.keys(q.opts).sort();if(cfg.shuffle)keys=shuffle(keys);return {q,order:keys,sel:new Set(),done:false,ok:null}}),i:0,mode:cfg.mode}
}
function start(p,n){S=mk(shuffle(p).slice(0,n),'隨機測驗');quiz()}
function startWrong(qs){if(!qs.length)return;S=mk(shuffle(qs),'錯題重練');S.wrongMode=true;quiz()}
const setEq=(a,b)=>a.size===b.size&&[...a].every(x=>b.has(x));
function grade(it){const ans=new Set(it.q.fin);it.ok=setEq(it.sel,ans);it.done=true;const id=it.q.id;stats[id]=stats[id]||{c:0,w:0};if(it.ok){stats[id].c++;wrong.delete(id)}else{stats[id].w++;wrong.add(id)}saveAll()}
function quiz(){
 const it=S.qs[S.i],q=it.q,n=S.qs.length,ans=new Set(q.fin),reveal=it.done&&(S.mode==='instant'||S.review);
 const opts=it.order.map((k,idx)=>{
  const L=String.fromCharCode(65+idx);let cls='opt';
  if(reveal){if(ans.has(k)&&it.sel.has(k))cls+=' ok';else if(it.sel.has(k))cls+=' no';else if(ans.has(k))cls+=' miss'}
  else if(it.sel.has(k))cls+=' sel';
  return $('button',{class:cls,disabled:it.done&&S.mode==='instant',onclick:()=>{if(it.done&&S.mode==='instant')return;if(q.multi){it.sel.has(k)?it.sel.delete(k):it.sel.add(k)}else{it.sel=new Set([k])}quiz()}},$('span',{class:'k'},L),$('span',{},q.opts[k]))});
 const dots=$('div',{class:'q'},S.qs.map((x,j)=>$('div',{class:'dot'+(j===S.i?' cur':'')+(S.mode==='instant'&&x.done?(x.ok?' ok':' no'):(x.sel.size?' done':'')),onclick:()=>{S.i=j;quiz()}},j+1)));
 const last_=S.i===n-1;
 const nav=$('div',{class:'nav'},$('button',{onclick:()=>{if(confirm('離開本次測驗？進度不會保留。'))home()}},'離開'),
  $('div',{class:'row'},$('button',{disabled:S.i===0,onclick:()=>{S.i--;quiz()}},'上一題'),
  S.mode==='instant'&&!it.done?$('button',{class:'primary',disabled:!it.sel.size,onclick:()=>{grade(it);quiz()}},'送出答案'):
  last_?$('button',{class:'primary',onclick:finish},'完成並看成績'):$('button',{class:'primary',onclick:()=>{S.i++;quiz()}},'下一題')));
 const fbs=[];
 if(reveal){fbs.push($('div',{class:'fb '+(it.ok?'ok':'no')},it.ok?'✔ 答對了':'✘ 答錯了，正確答案：'+it.order.map((k,i)=>ans.has(k)?String.fromCharCode(65+i):null).filter(Boolean).join('、')));fbs.push($('div',{class:'expl'},'解析：'+q.expl))}
 show([$('div',{class:'row',style:'justify-content:space-between'},$('b',{},`${S.label}　${S.i+1} / ${n}`),$('span',{class:'sub'},S.mode==='instant'?'即時解析':'考試模式')),
  $('div',{class:'bar'},$('i',{style:`width:${(S.i+1)/n*100}%`})),
  $('div',{class:'card'},$('div',{class:'tags'},$('span',{class:'tag'},tagD(q)),$('span',{class:'tag'},SRC[q.code]+' '+q.id),q.multi?$('span',{class:'tag m'},`複選・選 ${q.fin.length} 個`):$('span',{class:'tag'},'單選')),$('div',{class:'stem'},q.stem),opts,fbs),
  $('details',{},$('summary',{},'題目導覽'),$('div',{class:'in'},dots)),nav]);
}
function finish(){
 const un=S.qs.filter(x=>!x.sel.size).length;
 if(S.mode==='exam'&&un&&!confirm(`還有 ${un} 題未作答，確定交卷？（未作答視為答錯）`))return;
 S.qs.forEach(x=>{if(!x.done)grade(x)});
 const ok=S.qs.filter(x=>x.ok).length,n=S.qs.length,pct=Math.round(100*ok/n);
 if(!S.wrongMode){last={pct,ok,n,at:Date.now()};LS.set('aib_last',last)}
 result(ok,n,pct)
}
function result(ok,n,pct){
 const bt={};S.qs.forEach(x=>{const t=bt[x.q.dm]=bt[x.q.dm]||{c:0,n:0};t.n++;if(x.ok)t.c++});
 const wr=S.qs.filter(x=>!x.ok).map(x=>x.q);
 const list=S.qs.map((x,j)=>{const q=x.q,ans=new Set(q.fin);
  return $('details',{},$('summary',{},$('span',{class:'pill '+(x.ok?'ok':'no')},x.ok?'✔':'✘'),$('span',{},`${j+1}. ${q.stem.length>90?q.stem.slice(0,90)+'…':q.stem}`)),
  $('div',{class:'in'},$('div',{class:'tags'},$('span',{class:'tag'},tagD(q)),$('span',{class:'tag'},SRC[q.code]+' '+q.id)),$('div',{class:'stem'},q.stem),
  x.order.map((k,i)=>$('div',{class:'opt '+(ans.has(k)&&x.sel.has(k)?'ok':x.sel.has(k)?'no':ans.has(k)?'miss':''),style:'cursor:default'},$('span',{class:'k'},String.fromCharCode(65+i)),$('span',{},q.opts[k]))),
  $('div',{class:'expl'},'解析：'+q.expl)))});
 show([$('h1',{},'測驗結果'),$('div',{class:'card'},$('div',{class:'score'},pct+'%'),$('div',{class:'sub'},`答對 ${ok} / ${n} 題（${S.label}）`),
  $('table',{},$('thead',{},$('tr',{},$('th',{},'主題'),$('th',{},'答對'))),$('tbody',{},Object.entries(bt).sort((a,b)=>a[0]-b[0]).map(([tn,t])=>$('tr',{},$('td',{},S.qs.find(x=>x.q.dm==tn).q.domain),$('td',{},`${t.c}/${t.n}`)))))),
  $('div',{class:'row',style:'margin-bottom:14px'},$('button',{class:'primary',disabled:!wr.length,onclick:()=>startWrong(wr)},`重練本次錯題（${wr.length}）`),$('button',{disabled:!wrong.size,onclick:()=>startWrong([...wrong].map(i=>byId[i]))},`練習全部錯題本（${wrong.size}）`),$('button',{onclick:home},'回首頁')),
  $('h2',{},'逐題檢討'),list]);
}
if(cfg.v!==3){cfg.sources=[...new Set([...cfg.sources,...Object.keys(SRC)])];cfg.v=3;LS.set('aib_cfg2',cfg)}
home();
</script></body></html>

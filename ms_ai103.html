<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f6cbd">
<title>Microsoft AI-103 互動測驗</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1d2530;--mut:#6b7686;--line:#dde2ea;--pri:#0f6cbd;--ok:#1b8a4b;--okbg:#e6f5ec;--bad:#c4314b;--badbg:#fbe9ed;--warn:#b45309;--warnbg:#fff4e0}
@media(prefers-color-scheme:dark){:root{--bg:#14181e;--card:#1d232c;--ink:#e6eaf0;--mut:#93a0b3;--line:#2e3744;--pri:#4aa3f0;--ok:#4cc17f;--okbg:#17352a;--bad:#ff7a90;--badbg:#3a1c25;--warn:#f0b35a;--warnbg:#3a2d14}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 -apple-system,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0 0 6px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stat{color:var(--mut);font-size:13px}
.stat b{color:var(--ink)}
button,select,input[type=text],input[type=number]{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 12px}
button{cursor:pointer}button:hover:not(:disabled){border-color:var(--pri)}button:disabled{opacity:.45;cursor:default}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff}
button.ok{background:var(--ok);border-color:var(--ok);color:#fff}button.no{background:var(--bad);border-color:var(--bad);color:#fff}
main{max-width:1100px;margin:0 auto;padding:14px;display:grid;grid-template-columns:1fr 250px;gap:14px}
@media(max-width:860px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.tag{font-size:12px;padding:1px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--mut)}
.tag.t{color:var(--pri);border-color:var(--pri)}.tag.w{color:var(--bad);border-color:var(--bad)}.tag.f{color:var(--warn);border-color:var(--warn)}
.qtext p{margin:.4em 0}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;margin:8px 0;cursor:pointer}
.opt:hover{border-color:var(--pri)}
.opt.sel{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 10%,transparent)}
.opt.right{border-color:var(--ok);background:var(--okbg)}.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt .l{font-weight:700;min-width:1.4em}
.opt.locked{cursor:default}
img.qi{max-width:100%;height:auto;border:1px solid var(--line);border-radius:8px;margin:8px 0;background:#fff;display:block}
details{margin:8px 0;border:1px dashed var(--line);border-radius:8px;padding:6px 10px}
summary{cursor:pointer;color:var(--mut);font-size:13px}
pre.ocr{white-space:pre-wrap;font:12px/1.5 ui-monospace,Menlo,monospace;color:var(--mut);margin:6px 0 0}
.res{margin-top:12px;padding:10px 14px;border-radius:10px}
.res.ok{background:var(--okbg);color:var(--ok)}.res.no{background:var(--badbg);color:var(--bad)}
.res .sub{color:var(--ink);font-size:13px;margin-top:4px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:5px}
.grid button{padding:4px 0;font-size:12px;border-radius:6px}
.grid .cur{outline:2px solid var(--pri)}
.grid .g{background:var(--okbg);border-color:var(--ok);color:var(--ok)}.grid .b{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.side h3{font-size:14px;margin:0 0 8px}
.legend{font-size:12px;color:var(--mut);margin-top:8px}
.field{display:flex;flex-direction:column;gap:3px;margin-bottom:8px;font-size:13px;color:var(--mut)}
.row{display:flex;gap:6px;flex-wrap:wrap}
.done{text-align:center;padding:30px 10px}
.done h2{margin:0 0 8px}
.kbd{font-size:11px;color:var(--mut)}

.only-m{display:none}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:50;overflow:auto;-webkit-overflow-scrolling:touch;padding:12px}
#lb[hidden]{display:none}
#lb img{max-width:none;width:min(1400px,200%);background:#fff;border-radius:6px;display:block;margin:auto}
#lb .x{position:fixed;top:10px;right:14px;color:#fff;font-size:28px;cursor:pointer}
img.qi{cursor:zoom-in}
pre.ocr{word-break:break-word}
.actions button{flex:0 0 auto}
@media(max-width:860px){
 header{position:static;padding:10px 12px}
 .only-m{display:inline-block}
 #filters{display:none;margin-top:8px}
 #filters.open{display:flex}
 #filters select,#filters input[type=text],#filters button{flex:1 1 44%;min-width:0}
 #filters .stat{flex:1 1 44%}
 #filters #stat{display:none}
 main{padding:10px;gap:10px;grid-template-columns:1fr}
 .card{padding:12px;border-radius:10px}
 .side{order:2}
 .grid{max-height:220px;overflow:auto;grid-template-columns:repeat(auto-fill,minmax(42px,1fr))}
 .grid button{padding:8px 0}
 .actions.nav{position:sticky;bottom:0;background:var(--card);margin:14px -12px -12px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:0 0 10px 10px;z-index:4}
 .actions.nav button{flex:1 1 0}
 .actions.nav #bSub{flex:2 1 0}
}
@media(max-width:560px){
 body{font-size:16px}
 header h1{font-size:15px}
 button,select,input[type=text]{font-size:16px;min-height:44px}
 .opt{padding:12px;gap:8px}
 .qhead{gap:6px}
 .qhead #bFlag{margin-left:auto}
 .qhead .tag[style*="auto"]{margin-left:0!important}
 .actions>button.ok,.actions>button.no,.actions>#bRev{flex:1 1 0}
}
@media(min-width:1400px){main{max-width:1280px;grid-template-columns:1fr 300px}}
</style>
</head>
<body>
<header>
 <h1>Microsoft AI-103 互動測驗</h1>
 <div class="bar"><button id="bFilt" class="only-m">☰ 篩選 / 抽題</button><span class="stat only-m" id="stat2"></span></div>
 <div class="bar" id="filters">
  <select id="mode" title="練習模式">
   <option value="all">全部題目</option>
   <option value="wrong">錯題練習</option>
   <option value="unseen">未作答</option>
   <option value="flag">已標記</option>
  </select>
  <select id="dom"><option value="">全部領域</option></select>
  <select id="cnt" title="隨機抽題數"><option value="0">全部題數</option><option value="10">隨機 10 題</option><option value="20">隨機 20 題</option><option value="50">隨機 50 題</option></select>
  <button id="bDraw" title="重新隨機抽題">🎲 重新抽題</button>
  <select id="ftype"><option value="">全部題型</option><option value="MCQ">選擇題</option><option value="HOTSPOT">HOTSPOT</option><option value="DRAG DROP">DRAG DROP</option></select>
  <input id="q" type="text" placeholder="關鍵字搜尋" style="width:140px">
  <label class="stat"><input type="checkbox" id="shuf"> 隨機順序</label>
  <label class="stat" title="錯題練習中答對時自動移出錯題本"><input type="checkbox" id="clr" checked> 答對移出錯題本</label>
  <span class="stat" id="stat"></span>
 </div>
<div id="lb" hidden></div>
</header>
<main>
 <section>
  <div class="card" id="card"></div>
 </section>
 <aside class="side">
  <div class="card" style="margin-bottom:14px">
   <h3 id="gtitle">題號</h3>
   <div class="grid" id="grid"></div>
   <div class="legend"><span style="color:var(--ok)">■</span> 答對　<span style="color:var(--bad)">■</span> 答錯　□ 未答　<span class="kbd">★ 已標記</span></div>
  </div>
  <div class="card">
   <h3>工具</h3>
   <div class="row">
    <button id="bExp">匯出進度</button>
    <button id="bImp">匯入進度</button>
    <button id="bRst">重置全部</button>
   </div>
   <input type="file" id="fImp" accept=".json" hidden>
   <div id="dstat" style="margin-top:12px;font-size:12px"></div>
   <div class="kbd" style="margin-top:10px">快捷鍵：A–F 選答案、Enter 送出/下一題、←/→ 上下題、F 標記</div>
  </div>
 </aside>
</main>
<script src="ms_ai103.js"></script>
<script>
(function(){
const DATA=window.MS_AI103, QS=DATA.questions, KEY='ms_ai103_progress_v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// progress: {r:{n:{ok:bool,t:count,w:count}}, flag:{n:1}}
let P={r:{},flag:{}};
try{const s=localStorage.getItem(KEY);if(s)P=Object.assign(P,JSON.parse(s))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}}
let list=[],idx=0,state={sel:new Set(),done:false,revealed:false};
const DN=Object.fromEntries((DATA.domains||[]).map(d=>[d.id,d]));
const byN=Object.fromEntries(QS.map(q=>[q.n,q]));

(DATA.domains||[]).forEach(d=>{const o=document.createElement('option');o.value=d.id;o.textContent=d.name;$('#dom').appendChild(o)});
function buildList(keepN){
  const mode=$('#mode').value,ft=$('#ftype').value,dm=$('#dom').value,cn=+$('#cnt').value,kw=$('#q').value.trim().toLowerCase();
  let a=QS.filter(q=>{
    const r=P.r[q.n];
    if(mode==='wrong'&&!(r&&!r.ok))return false;
    if(mode==='unseen'&&r)return false;
    if(mode==='flag'&&!P.flag[q.n])return false;
    if(ft&&q.type!==ft)return false;
    if(dm&&q.dom!==dm)return false;
    if(kw){const h=(q.n+' '+q.text.join(' ')+' '+q.opts.map(o=>o.t).join(' ')+' '+q.ocr.join(' ')+' '+q.aocr.join(' ')).toLowerCase();if(!h.includes(kw))return false}
    return true;
  });
  if($('#shuf').checked||cn){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}}
  if(cn&&a.length>cn)a=a.slice(0,cn);
  list=a;
  idx=keepN!=null?Math.max(0,list.findIndex(q=>q.n===keepN)):0;
  go(idx);
}
function stats(){
  let ok=0,bad=0;for(const n in P.r){P.r[n].ok?ok++:bad++}
  const tot=ok+bad;
  $('#stat').innerHTML=`共 <b>${QS.length}</b> 題・已答 <b>${tot}</b>・答對 <b style="color:var(--ok)">${ok}</b>・錯題本 <b style="color:var(--bad)">${bad}</b>`+(tot?`・正確率 <b>${Math.round(ok/tot*100)}%</b>`:'');
  $('#stat2').innerHTML=$('#stat').innerHTML.replace(/共 <b>\d+<\/b> 題・/,'');
  const wo=$('#mode').querySelector('[value=wrong]');wo.textContent=`錯題練習（${bad}）`;
  $('#mode').querySelector('[value=flag]').textContent=`已標記（${Object.keys(P.flag).length}）`;
  $('#dstat').innerHTML='<b>各領域正確率</b><br>'+(DATA.domains||[]).map(d=>{const qs=QS.filter(q=>q.dom===d.id);let o=0,t=0;qs.forEach(q=>{const r=P.r[q.n];if(r){t++;if(r.ok)o++}});return `${esc(d.name)}（${d.w}）：${t?Math.round(o/t*100)+'%':'–'}　<span style="color:var(--mut)">${o}/${t}／${qs.length} 題</span>`}).join('<br>');
  $('#mode').querySelector('[value=unseen]').textContent=`未作答（${QS.length-tot}）`;
}
function grid(){
  $('#gtitle').textContent=`題號（${list.length}）`;
  $('#grid').innerHTML=list.map((q,i)=>{const r=P.r[q.n];return `<button data-i="${i}" class="${r?(r.ok?'g':'b'):''} ${i===idx?'cur':''}">${q.n}${P.flag[q.n]?'★':''}</button>`}).join('');
}
function go(i){
  idx=i;state={sel:new Set(),done:false,revealed:false};render();
}
function imgs(arr,ocr,label){
  return arr.map((s,i)=>`<img class="qi" src="${esc(s)}" alt="">`+(ocr[i]&&ocr[i].trim()?`<details><summary>${label}文字（OCR）</summary><pre class="ocr">${esc(ocr[i])}</pre></details>`:'')).join('');
}
function render(){
  stats();grid();
  const c=$('#card');
  if(!list.length){
    const m=$('#mode').value;
    c.innerHTML=`<div class="done"><h2>${m==='wrong'?'🎉 錯題本是空的':'沒有符合條件的題目'}</h2><p class="stat">${m==='wrong'?'答錯的題目會自動收集在這裡。':'請調整上方篩選條件。'}</p></div>`;return;
  }
  const q=list[idx],r=P.r[q.n];
  let h=`<div class="qhead"><b>Question #${q.n}</b><span class="tag">${DN[q.dom]?DN[q.dom].name:''}</span><span class="tag t">${q.type==='MCQ'?(q.multi?'多選 '+q.ans.length+' 項':'單選'):q.type}</span>`+
   (r?(r.ok?'<span class="tag">上次答對</span>':'<span class="tag w">上次答錯</span>'):'')+
   (r?`<span class="tag">作答 ${r.t} 次・錯 ${r.w} 次</span>`:'')+
   `<span class="tag" style="margin-left:auto">${idx+1} / ${list.length}</span><button id="bFlag" class="${P.flag[q.n]?'f':''}">${P.flag[q.n]?'★ 已標記':'☆ 標記'}</button></div>`;
  if(q.case&&DATA.cases[q.case])h+=`<details><summary>案例背景（Case Study）</summary>${DATA.cases[q.case].map(p=>`<p>${esc(p)}</p>`).join('')}</details>`;
  h+=`<div class="qtext">${q.text.map(p=>`<p>${esc(p)}</p>`).join('')}</div>`;
  h+=imgs(q.imgs,q.ocr,'圖片');
  if(q.type==='MCQ'){
    h+=q.opts.map(o=>{
      let cl='opt';
      if(state.sel.has(o.l))cl+=' sel';
      if(state.done){cl+=' locked';const right=q.ans.includes(o.l);if(right)cl=cl.replace(' sel','')+' right';else if(state.sel.has(o.l))cl=cl.replace(' sel','')+' wrong'}
      return `<div class="${cl}" data-l="${o.l}"><span class="l">${o.l}.</span><span>${esc(o.t)}</span></div>`}).join('');
    if(state.done){
      const ok=state.ok;
      h+=`<div class="res ${ok?'ok':'no'}"><b>${ok?'✔ 答對了':'✘ 答錯了'}</b>　正確答案：<b>${q.ans}</b><div class="sub">`+
       (q.dist.length?`社群投票分布：${esc(q.dist.join('　'))}`:'')+(q.vote&&q.vote!==q.ans?`　<span style="color:var(--warn)">⚠ 社群多數選 ${q.vote}，與網站標示答案不同，請自行查證</span>`:'')+`</div></div>`;
    }
    h+=`<div class="actions nav"><button class="pri" id="bSub" ${state.done||!state.sel.size?'disabled':''}>送出答案</button>`;
  }else{
    h+=`<div class="actions">`;
    if(!state.revealed)h+=`<button class="pri" id="bRev">顯示答案</button>`;
    h+=`</div>`;
    if(state.revealed){
      h+=`<div class="res ${state.done?(state.ok?'ok':'no'):''}" style="${state.done?'':'background:var(--warnbg);color:var(--warn)'}"><b>答案圖</b>${state.done?`　${state.ok?'✔ 你標記為答對':'✘ 你標記為答錯'}`:'　請對照你的作答自評'}</div>`+imgs(q.aimgs,q.aocr,'答案圖');
      if(!state.done)h+=`<div class="actions"><button class="ok" id="bSelfOk">我答對了</button><button class="no" id="bSelfNo">我答錯了</button></div>`;
    }
    h+=`<div class="actions nav">`;
  }
  h+=`<button id="bPrev" ${idx===0?'disabled':''}>← 上一題</button><button id="bNext" class="${state.done?'pri':''}" ${idx>=list.length-1?'disabled':''}>下一題 →</button></div>`;
  c.innerHTML=h;
}
function record(ok){
  const q=list[idx];state.done=true;state.ok=ok;
  const r=P.r[q.n]||{t:0,w:0};r.t++;if(!ok)r.w++;r.ok=ok;P.r[q.n]=r;
  if($('#mode').value==='wrong'&&ok&&!$('#clr').checked)P.r[q.n].ok=false; // keep in wrong book
  save();render();
}
function submit(){
  const q=list[idx];if(state.done||!state.sel.size)return;
  const a=[...state.sel].sort().join('');state.revealed=true;
  record(a===q.ans.split('').sort().join(''));
}
$('#card').addEventListener('click',e=>{
  const t=e.target;
  const o=t.closest('.opt');
  if(o&&!state.done){const q=list[idx],l=o.dataset.l;
    if(q.multi){state.sel.has(l)?state.sel.delete(l):state.sel.add(l)}else{state.sel=new Set([l])}
    render();return}
  const id=t.id;
  if(id==='bSub')submit();
  else if(id==='bRev'){state.revealed=true;render()}
  else if(id==='bSelfOk')record(true);
  else if(id==='bSelfNo')record(false);
  else if(id==='bPrev'&&idx>0)go(idx-1);
  else if(id==='bNext'&&idx<list.length-1)go(idx+1);
  else if(id==='bFlag'){const n=list[idx].n;P.flag[n]?delete P.flag[n]:P.flag[n]=1;save();render()}
});
$('#grid').addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(+b.dataset.i)});
['mode','ftype','shuf','dom','cnt'].forEach(id=>$('#'+id).addEventListener('change',()=>buildList()));
$('#bDraw').onclick=()=>buildList();
$('#bFilt').onclick=()=>$('#filters').classList.toggle('open');
const lb=$('#lb');
document.addEventListener('click',e=>{const im=e.target.closest&&e.target.closest('img.qi');if(im){lb.innerHTML='<span class="x">✕</span><img src="'+im.getAttribute('src')+'">';lb.hidden=false;return}if(e.target.closest('#lb'))lb.hidden=true});
document.addEventListener('keydown',e=>{if(e.key==='Escape')lb.hidden=true});
let tm;$('#q').addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(()=>buildList(),250)});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||!list.length)return;
  const q=list[idx],k=e.key;
  if(/^[a-fA-F]$/.test(k)&&q.type==='MCQ'&&!state.done){const l=k.toUpperCase();if(q.opts.some(o=>o.l===l)){if(q.multi){state.sel.has(l)?state.sel.delete(l):state.sel.add(l)}else state.sel=new Set([l]);render()}}
  else if(k==='Enter'){if(q.type==='MCQ'){state.done?(idx<list.length-1&&go(idx+1)):submit()}else{if(!state.revealed){state.revealed=true;render()}else if(state.done&&idx<list.length-1)go(idx+1)}}
  else if(k==='ArrowRight'&&idx<list.length-1)go(idx+1);
  else if(k==='ArrowLeft'&&idx>0)go(idx-1);
  else if(k==='f'||k==='F'){const n=q.n;P.flag[n]?delete P.flag[n]:P.flag[n]=1;save();render()}
});
$('#bRst').onclick=()=>{if(confirm('確定清除所有作答紀錄、錯題本與標記？')){P={r:{},flag:{}};save();buildList()}};
$('#bExp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(P)],{type:'application/json'}));a.download='ms_ai103_progress.json';a.click()};
$('#bImp').onclick=()=>$('#fImp').click();
$('#fImp').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);P={r:o.r||{},flag:o.flag||{}};save();buildList();alert('已匯入進度')}catch(x){alert('檔案格式錯誤')}};rd.readAsText(f)};
buildList();
})();
</script>
</body>
</html>
